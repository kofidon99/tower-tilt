<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Neon Drift - a one-thumb neon lane racer. Dodge traffic, bank near misses, charge the boost and smash through the grid.">
<meta name="theme-color" content="#05030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0620'/%3E%3Cpath d='M11 24V8l10 16V8' stroke='%237ff0ff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;background:#05030f}
img{max-width:100%}[hidden]{display:none!important}</style>
<title>Neon Drift</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:#05030f; color:#eaf2ff; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app{
    position:fixed; inset:0; overflow:hidden; background:#05030f;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #c{ display:block; position:absolute; inset:0; }

  /* ---- top-right glass buttons ---- */
  #sysbar{ position:absolute; top:14px; right:14px; z-index:6; display:flex; gap:9px; }
  .sysbtn{
    width:42px; height:42px; border-radius:13px; border:1px solid rgba(140,220,255,.28);
    background:rgba(12,10,32,.55); color:#bfe9ff; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:transform .12s ease, border-color .12s ease;
  }
  .sysbtn:hover{ border-color:rgba(140,220,255,.6); }
  .sysbtn:active{ transform:scale(.92); }
  .sysbtn svg{ width:20px; height:20px; display:block; }

  /* ---- overlays ---- */
  .overlay{
    position:absolute; inset:0; z-index:5; padding:24px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    text-align:center;
    background:radial-gradient(120% 90% at 50% 42%, rgba(18,8,46,.70) 0%, rgba(4,2,12,.93) 70%);
  }
  .logo{
    font-size:clamp(44px,13vmin,86px); font-weight:900; letter-spacing:.03em; line-height:.92;
    margin:0; text-transform:uppercase;
    background:linear-gradient(175deg,#ffffff 6%,#8df3ff 38%,#3ba9ff 62%,#c65cff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 26px rgba(90,190,255,.55));
  }
  .tagline{
    margin:0; font-size:clamp(11px,2.8vmin,13px); letter-spacing:.34em; text-transform:uppercase;
    color:#7fb6d8; font-weight:700;
  }
  .btn{
    appearance:none; -webkit-appearance:none; border:0; cursor:pointer; font-family:inherit;
    font-size:clamp(15px,3.6vmin,18px); font-weight:800; letter-spacing:.16em; text-transform:uppercase;
    padding:17px 40px; border-radius:999px; color:#031219; margin-top:4px;
    background:linear-gradient(180deg,#8ff8ff 0%,#22c8ec 100%);
    box-shadow:0 0 0 1px rgba(190,250,255,.65) inset, 0 10px 34px rgba(40,205,255,.42);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{ box-shadow:0 0 0 1px rgba(220,255,255,.9) inset, 0 12px 44px rgba(60,220,255,.6); }
  .btn:active{ transform:translateY(2px) scale(.98); }
  .btn.ghost{
    background:transparent; color:#9fd7f5; padding:12px 26px; font-size:13px;
    box-shadow:0 0 0 1px rgba(120,190,230,.34) inset;
  }
  .hint{
    margin:6px 0 0; font-size:clamp(11px,2.7vmin,13px); line-height:1.7; color:#7d9ec0;
    letter-spacing:.06em; max-width:32ch;
  }
  .hint b{ color:#bfe9ff; font-weight:700; }

  .scorecard{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:2px 0 2px; }
  .stat{
    min-width:124px; padding:14px 20px; border-radius:16px;
    background:rgba(14,12,38,.6); border:1px solid rgba(130,200,255,.20);
  }
  .stat .k{ font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:#7fa8c8; font-weight:700; }
  .stat .v{ font-size:clamp(28px,7.4vmin,40px); font-weight:900; letter-spacing:.01em; color:#fff; line-height:1.15; }
  .stat.best .v{ color:#ffd66e; }
  .headline{
    margin:0; font-size:clamp(26px,7.6vmin,44px); font-weight:900; letter-spacing:.05em; text-transform:uppercase;
    color:#fff; filter:drop-shadow(0 0 22px rgba(255,90,140,.5));
  }
  .record{
    margin:0; font-size:12px; font-weight:800; letter-spacing:.3em; text-transform:uppercase; color:#ffd66e;
    filter:drop-shadow(0 0 14px rgba(255,190,70,.6));
  }
  .runstats{
    margin:0; font-size:12px; letter-spacing:.14em; color:#7d9ec0; text-transform:uppercase;
    font-weight:700; line-height:1.9; max-width:30ch; text-wrap:balance;
  }

  :focus-visible{ outline:2px solid #8ff8ff; outline-offset:3px; }

  /* ---- difficulty picker ---- */
  /* One row at every width — three pills that share the space rather than
     wrapping two-and-one, which reads as a layout accident. */
  .tiers{
    display:flex; gap:8px; justify-content:center; margin:4px 0 0;
    width:100%; max-width:430px;
  }
  .tier{
    appearance:none; -webkit-appearance:none; cursor:pointer; font-family:inherit;
    border:1px solid rgba(130,200,255,.22); background:rgba(12,10,32,.55); color:#8fb8d6;
    padding:11px 9px; border-radius:14px; flex:1 1 0; min-width:0;
    display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center;
    transition:border-color .14s ease, background .14s ease, transform .12s ease, color .14s ease;
  }
  .tier:hover{ border-color:rgba(140,220,255,.55); }
  .tier:active{ transform:scale(.97); }
  .tier .tn{ font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
  .tier .tb{ font-size:10px; letter-spacing:.02em; line-height:1.3; color:#6d8fae; }
  .tier[aria-checked="true"]{
    border-color:rgba(143,248,255,.85); background:rgba(28,58,92,.62); color:#eafcff;
    box-shadow:0 0 24px rgba(45,200,255,.26);
  }
  .tier[aria-checked="true"] .tb{ color:#9fd7f5; }

  .tierline{
    margin:0; font-size:11px; letter-spacing:.26em; text-transform:uppercase;
    color:#7fa8c8; font-weight:800;
  }
  .suggest{
    display:flex; flex-direction:column; gap:9px; align-items:center; margin:0;
    padding:13px 18px; border-radius:15px;
    background:rgba(22,16,46,.72); border:1px solid rgba(255,214,110,.34);
  }
  .suggest .msg{
    margin:0; font-size:12px; letter-spacing:.09em; color:#ffd66e; font-weight:700; max-width:30ch;
  }
  .suggest .btn.ghost{
    margin:0; color:#ffe4a8; box-shadow:0 0 0 1px rgba(255,214,110,.45) inset;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="sysbar">
    <button class="sysbtn" id="btnSound" type="button" aria-label="Toggle sound"></button>
    <button class="sysbtn" id="btnPause" type="button" aria-label="Pause"></button>
  </div>

  <div class="overlay" id="ovMenu">
    <h1 class="logo">Neon<br>Drift</h1>
    <p class="tagline">Outrun the grid</p>
    <div class="tiers" id="tierPick" role="radiogroup" aria-label="Difficulty"></div>
    <button class="btn" id="btnPlay" type="button">Drive</button>
    <p class="hint" id="menuHint"></p>
  </div>

  <div class="overlay" id="ovOver" hidden>
    <h2 class="headline">Wrecked</h2>
    <p class="record" id="newRecord" hidden>New Record</p>
    <div class="scorecard">
      <div class="stat"><div class="k">Score</div><div class="v" id="finalScore">0</div></div>
      <div class="stat best"><div class="k" id="bestLabel">Best</div><div class="v" id="bestScore">0</div></div>
    </div>
    <p class="runstats" id="runStats"></p>
    <div class="suggest" id="suggestBox" hidden>
      <p class="msg" id="suggestMsg"></p>
      <button class="btn ghost" id="btnSuggest" type="button"></button>
    </div>
    <button class="btn" id="btnAgain" type="button">Race Again</button>
    <button class="btn ghost" id="btnMenu" type="button">Menu</button>
  </div>

  <div class="overlay" id="ovPause" hidden>
    <h2 class="headline">Paused</h2>
    <button class="btn" id="btnResume" type="button">Resume</button>
    <button class="btn ghost" id="btnQuit" type="button">End Run</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================================
     1. PLATFORM BRIDGE — YouTube Playables SDK with safe fallbacks.
     Every SDK call is feature-detected and wrapped, so the game runs
     identically on a plain web host, in an artifact, or inside Playables.
     ========================================================================= */
  var YT = (typeof window !== 'undefined' && window.ytgame) ? window.ytgame : null;

  var Platform = {
    audioAllowed: true,
    _firstFrameSent: false,
    _readySent: false,

    init: function (onPause, onResume, onAudioChange) {
      if (!YT) return;
      try { if (YT.system && YT.system.onPause) YT.system.onPause(onPause); } catch (e) {}
      try { if (YT.system && YT.system.onResume) YT.system.onResume(onResume); } catch (e) {}
      try {
        if (YT.system && typeof YT.system.isAudioEnabled === 'function') {
          this.audioAllowed = !!YT.system.isAudioEnabled();
        }
        if (YT.system && YT.system.onAudioEnabledChange) {
          YT.system.onAudioEnabledChange(function (on) {
            Platform.audioAllowed = !!on;
            onAudioChange();
          });
        }
      } catch (e) {}
    },

    // Called once the very first frame has been painted.
    firstFrame: function () {
      if (this._firstFrameSent) return;
      this._firstFrameSent = true;
      try { if (YT && YT.game && YT.game.firstFrameReady) YT.game.firstFrameReady(); } catch (e) {}
    },

    // Called only when the player can actually interact — required by policy.
    ready: function () {
      if (this._readySent) return;
      this._readySent = true;
      try { if (YT && YT.game && YT.game.gameReady) YT.game.gameReady(); } catch (e) {}
    }
  };

  /* =========================================================================
     2. STORAGE — Playables save data first, localStorage fallback.
     ========================================================================= */
  var SAVE_KEY = 'neondrift.v1';

  var Store = {
    data: {
      bests: { cruise: 0, drive: 0, redline: 0 },
      tier: 'drive',
      runs: 0,
      muted: false,
      seenTips: false,
      quickDeaths: 0,      // consecutive short runs — drives the tier suggestion
      offeredDown: false,
      offeredUp: false
    },

    best: function (id) { return Store.data.bests[id || Store.data.tier] || 0; },

    load: function (done) {
      var finish = function (obj) {
        if (obj && typeof obj === 'object') {
          // v1 stored a single numeric best with no notion of difficulty.
          // That score was set on what is now "Drive", so migrate it there.
          if (typeof obj.best === 'number') Store.data.bests.drive = obj.best;
          if (obj.bests && typeof obj.bests === 'object') {
            ['cruise', 'drive', 'redline'].forEach(function (k) {
              if (typeof obj.bests[k] === 'number') Store.data.bests[k] = obj.bests[k];
            });
          }
          if (typeof obj.tier === 'string' && tierById(obj.tier).id === obj.tier) Store.data.tier = obj.tier;
          if (typeof obj.runs === 'number') Store.data.runs = obj.runs;
          if (typeof obj.muted === 'boolean') Store.data.muted = obj.muted;
          if (typeof obj.seenTips === 'boolean') Store.data.seenTips = obj.seenTips;
          if (typeof obj.quickDeaths === 'number') Store.data.quickDeaths = obj.quickDeaths;
          if (typeof obj.offeredDown === 'boolean') Store.data.offeredDown = obj.offeredDown;
          if (typeof obj.offeredUp === 'boolean') Store.data.offeredUp = obj.offeredUp;
        }
        done();
      };
      if (YT && YT.game && YT.game.loadData) {
        var settled = false;
        var timer = setTimeout(function () { if (!settled) { settled = true; finish(null); } }, 2500);
        try {
          YT.game.loadData().then(function (raw) {
            if (settled) return; settled = true; clearTimeout(timer);
            var o = null; try { o = JSON.parse(raw || '{}'); } catch (e) {}
            finish(o);
          })['catch'](function () {
            if (settled) return; settled = true; clearTimeout(timer); finish(null);
          });
          return;
        } catch (e) { if (!settled) { settled = true; clearTimeout(timer); } }
      }
      var local = null;
      try { local = JSON.parse(window.localStorage.getItem(SAVE_KEY) || '{}'); } catch (e) {}
      finish(local);
    },

    save: function () {
      var raw = JSON.stringify(Store.data);
      if (YT && YT.game && YT.game.saveData) {
        try { YT.game.saveData(raw)['catch'](function () {}); return; } catch (e) {}
      }
      try { window.localStorage.setItem(SAVE_KEY, raw); } catch (e) {}
    }
  };

  /* =========================================================================
     3. AUDIO — 100% procedural (Web Audio). No files, no copyright exposure.
     ========================================================================= */
  var Sound = {
    ctx: null, master: null, engineGain: null, engineOsc: [], windGain: null,
    musicGain: null, noiseBuf: null, started: false, muted: false,
    nextNote: 0, step: 0,

    boot: function () {
      if (this.ctx) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      var ctx = this.ctx;

      this.master = ctx.createGain();
      this.master.gain.value = 0;
      this.master.connect(ctx.destination);

      // --- noise buffer (shared by wind + impacts)
      var len = Math.floor(ctx.sampleRate * 1.4);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var ch = buf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;

      // --- engine: two detuned saws through a lowpass
      var eg = ctx.createGain(); eg.gain.value = 0.0;
      var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 6;
      eg.connect(lp); lp.connect(this.master);
      this.engineGain = eg;
      [0, 7].forEach(function (det) {
        var o = ctx.createOscillator();
        o.type = 'sawtooth'; o.frequency.value = 58; o.detune.value = det;
        o.connect(eg); o.start();
        Sound.engineOsc.push(o);
      });

      // --- wind: looping noise through a bandpass
      var wsrc = ctx.createBufferSource(); wsrc.buffer = buf; wsrc.loop = true;
      var wbp = ctx.createBiquadFilter(); wbp.type = 'bandpass'; wbp.frequency.value = 1100; wbp.Q.value = 0.7;
      var wg = ctx.createGain(); wg.gain.value = 0;
      wsrc.connect(wbp); wbp.connect(wg); wg.connect(this.master); wsrc.start();
      this.windGain = wg;

      // --- music bus
      var mg = ctx.createGain(); mg.gain.value = 0.5; mg.connect(this.master);
      this.musicGain = mg;

      this.started = true;
      this.applyVolume();
    },

    resumeCtx: function () {
      if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
    },

    applyVolume: function () {
      if (!this.master) return;
      var on = !this.muted && Platform.audioAllowed;
      try { this.master.gain.setTargetAtTime(on ? 0.85 : 0.0, this.ctx.currentTime, 0.02); } catch (e) {}
    },

    hardStop: function () {
      if (!this.master) return;
      try { this.master.gain.setValueAtTime(0, this.ctx.currentTime); } catch (e) {}
    },

    // engine + wind track the car's speed
    drive: function (speed01, active) {
      if (!this.started) return;
      var t = this.ctx.currentTime;
      try {
        this.engineGain.gain.setTargetAtTime(active ? 0.13 : 0.0, t, 0.12);
        this.windGain.gain.setTargetAtTime(active ? 0.035 + speed01 * 0.06 : 0.0, t, 0.15);
        for (var i = 0; i < this.engineOsc.length; i++) {
          this.engineOsc[i].frequency.setTargetAtTime(52 + speed01 * 58, t, 0.14);
        }
      } catch (e) {}
    },

    blip: function (freq, dur, type, vol) {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol == null ? 0.25 : vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
      return o;
    },

    pickup: function (combo) {
      var base = 660 * Math.pow(1.06, Math.min(combo, 10));
      var o = this.blip(base, 0.16, 'triangle', 0.3);
      if (o) { try { o.frequency.exponentialRampToValueAtTime(base * 1.9, this.ctx.currentTime + 0.13); } catch (e) {} }
    },

    lifeUp: function () {
      this.blip(392, 0.26, 'sine', 0.26);
      this.blip(523, 0.30, 'sine', 0.22);
      this.blip(659, 0.34, 'triangle', 0.16);
    },

    // Losing a life: a downward two-tone thud, clearly not a game-over crash.
    hurt: function () {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      var s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
      var f = ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(1600, t);
      f.frequency.exponentialRampToValueAtTime(240, t + 0.34);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.34, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + 0.4);
      var o = ctx.createOscillator(), og = ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(233, t);
      o.frequency.exponentialRampToValueAtTime(110, t + 0.3);
      og.gain.setValueAtTime(0.28, t);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
      o.connect(og); og.connect(this.master); o.start(t); o.stop(t + 0.36);
    },

    nearMiss: function () {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      var s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
      var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
      bp.frequency.setValueAtTime(2600, t);
      bp.frequency.exponentialRampToValueAtTime(600, t + 0.22);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      s.connect(bp); bp.connect(g); g.connect(this.master);
      s.start(t); s.stop(t + 0.28);
    },

    boost: function () {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(160, t);
      o.frequency.exponentialRampToValueAtTime(1500, t + 0.45);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.2, t + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2600;
      o.connect(f); f.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + 0.55);
    },

    smash: function () {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      var s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
      var f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 900;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + 0.22);
    },

    crash: function () {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      var s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
      var f = ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(2200, t);
      f.frequency.exponentialRampToValueAtTime(180, t + 0.7);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + 0.9);
      var o = ctx.createOscillator(), og = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(36, t + 0.6);
      og.gain.setValueAtTime(0.42, t);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
      o.connect(og); og.connect(this.master); o.start(t); o.stop(t + 0.7);
    },

    ui: function () { this.blip(520, 0.08, 'square', 0.12); },

    // Simple procedural bassline + arp, tempo rises with speed. Fully original.
    music: function (speed01, active) {
      if (!this.started || !active) { this.nextNote = 0; return; }
      var ctx = this.ctx;
      var bpm = 104 + speed01 * 46;
      var spb = 60 / bpm / 2;                 // eighth notes
      var now = ctx.currentTime;
      if (this.nextNote === 0) this.nextNote = now + 0.06;
      var ROOT = [55.00, 55.00, 65.41, 61.74];              // A1 A1 C2 B1
      var ARP = [220.00, 261.63, 329.63, 392.00, 329.63, 261.63];
      var guard = 0;
      while (this.nextNote < now + 0.2 && guard++ < 24) {
        var t = this.nextNote;
        var bar = Math.floor(this.step / 8) % 4;
        // bass on every other eighth
        if (this.step % 2 === 0) {
          var bo = ctx.createOscillator(), bg = ctx.createGain();
          bo.type = 'triangle';
          bo.frequency.setValueAtTime(ROOT[bar], t);
          bg.gain.setValueAtTime(0.0001, t);
          bg.gain.linearRampToValueAtTime(0.3, t + 0.015);
          bg.gain.exponentialRampToValueAtTime(0.0001, t + spb * 1.7);
          bo.connect(bg); bg.connect(this.musicGain);
          bo.start(t); bo.stop(t + spb * 1.8);
        }
        // arp shimmer
        var ao = ctx.createOscillator(), ag = ctx.createGain();
        ao.type = 'square';
        ao.frequency.setValueAtTime(ARP[this.step % ARP.length] * (bar === 2 ? 1.19 : 1), t);
        ag.gain.setValueAtTime(0.0001, t);
        ag.gain.linearRampToValueAtTime(0.045 + speed01 * 0.03, t + 0.01);
        ag.gain.exponentialRampToValueAtTime(0.0001, t + spb * 0.9);
        var af = ctx.createBiquadFilter(); af.type = 'lowpass'; af.frequency.value = 1400 + speed01 * 2200;
        ao.connect(af); af.connect(ag); ag.connect(this.musicGain);
        ao.start(t); ao.stop(t + spb);

        this.step++;
        this.nextNote += spb;
      }
    }
  };

  /* =========================================================================
     4. CONSTANTS + HELPERS
     ========================================================================= */
  var LOGICAL_H = 960;
  var LANES = 4;
  var PLAYER_Y = 0.72;
  var LANE_SHIFT_TIME = 0.115;
  var BOOST_TIME = 3.2;
  var BOOST_SPEED_MUL = 1.55;
  var ORB_ENERGY = 12;
  var INVULN_TIME = 1.9;

  /* ---- difficulty ------------------------------------------------------
     Tuned around REACTION TIME, not around making the car worse to drive.
     A car spawns ~861 logical units above you and closes at
     speed * (1 - frac), so the window you get to read it and move is
     861 / (speed * (1 - frac)) seconds. Each tier below is built backwards
     from the window it should give at its top speed:

        Cruise   ~1.4 - 2.4s      learning, or lower reaction speed
        Drive    ~0.9 - 1.5s      the v1 balance
        Redline  ~0.7 - 1.1s      fast hands only

     Steering feel (LANE_SHIFT_TIME) is deliberately identical in all three —
     difficulty comes from the world, never from sluggish controls. */
  var TIERS = [
    {
      id: 'cruise', name: 'Cruise', blurb: 'Room to think',
      base: 480, gain: 460, tau: 70, creep: 0.6, creepMax: 120,
      frac: [0.42, 0.66], gapMul: 1.34, waveAt: [20, 55, 110],
      driftAt: 55, barrierAt: 95, driftOdds: 0.16,
      lives: 4, maxLives: 6, lifeEvery: [26, 38],
      forgive: 0.58, scoreMul: 0.7
    },
    {
      id: 'drive', name: 'Drive', blurb: 'The real thing',
      base: 600, gain: 700, tau: 55, creep: 1.1, creepMax: 200,
      frac: [0.34, 0.60], gapMul: 1.0, waveAt: [12, 34, 72],
      driftAt: 35, barrierAt: 60, driftOdds: 0.22,
      lives: 3, maxLives: 5, lifeEvery: [34, 50],
      forgive: 0.66, scoreMul: 1.0
    },
    {
      id: 'redline', name: 'Redline', blurb: 'Fast hands only',
      base: 720, gain: 860, tau: 42, creep: 1.5, creepMax: 260,
      frac: [0.30, 0.56], gapMul: 0.82, waveAt: [6, 18, 40],
      driftAt: 18, barrierAt: 34, driftOdds: 0.30,
      lives: 2, maxLives: 3, lifeEvery: [40, 58],
      forgive: 0.70, scoreMul: 1.45
    }
  ];

  function tierById(id) {
    for (var i = 0; i < TIERS.length; i++) if (TIERS[i].id === id) return TIERS[i];
    return TIERS[1];
  }
  function tierIndex(id) {
    for (var i = 0; i < TIERS.length; i++) if (TIERS[i].id === id) return i;
    return 1;
  }

  // Deliberately no cyan/blue in here — that hue belongs to the player car
  // alone, so you can always find yourself at a glance.
  var TRAFFIC_COLORS = [
    ['#ff4d7e', '#8e0b33'], ['#ffb03a', '#8a4a03'], ['#c879ff', '#4a1580'],
    ['#59f39a', '#0a5c36'], ['#ff7a45', '#7a2707'], ['#ff5ec8', '#7d0b57']
  ];

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function rndi(a, b) { return Math.floor(rnd(a, b + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function fmt(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  /* =========================================================================
     5. VIEW / CANVAS SCALING
     Scale is driven by height, so the road keeps a constant on-screen size and
     the extra width in 1:1 / 16:9 simply reveals more of the city. That makes
     the same build read correctly at 9:16, 1:1 and 16:9 with no letterboxing.
     ========================================================================= */
  var app = document.getElementById('app');
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });

  var view = { w: 540, h: LOGICAL_H, scale: 1, dpr: 1 };
  var road = { w: 460, left: 40, laneW: 115, carW: 76 };
  var blocks = { left: [], right: [] };

  /* ---- sprite cache ---------------------------------------------------
     Canvas shadowBlur is recomputed per fill and is by far the most
     expensive thing a neon look asks for. Everything that glows and does
     not change shape gets painted once into an offscreen canvas at the
     current device resolution and blitted thereafter. Rebuilt on resize. */
  var sprites = {};
  var spriteQ = 2;

  function sprite(key, w, h, paint) {
    var k = key + '|' + Math.round(w) + 'x' + Math.round(h) + '@' + spriteQ;
    var hit = sprites[k];
    if (hit) return hit;
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.ceil(w * spriteQ));
    cv.height = Math.max(1, Math.ceil(h * spriteQ));
    var c2 = cv.getContext('2d');
    c2.setTransform(spriteQ, 0, 0, spriteQ, 0, 0);
    paint(c2, w, h);
    hit = { cv: cv, w: w, h: h };
    sprites[k] = hit;
    return hit;
  }

  function blit(s, cx, cy) {
    ctx.drawImage(s.cv, cx - s.w / 2, cy - s.h / 2, s.w, s.h);
  }

  function layout() {
    var cw = Math.max(1, app.clientWidth || window.innerWidth);
    var chh = Math.max(1, app.clientHeight || window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    // Render-resolution budget. A large desktop window at 2x backing store is
    // pure fill-rate cost for a game whose art is all flat neon; past ~2.6M
    // device pixels we step the density down instead of dropping frames. The
    // difference is invisible, holding 60fps is not.
    var budget = 2.6e6;
    var pxCount = cw * chh * dpr * dpr;
    if (pxCount > budget) dpr = Math.max(1, dpr * Math.sqrt(budget / pxCount));

    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(chh * dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = chh + 'px';

    view.dpr = dpr;
    view.scale = chh / LOGICAL_H;
    view.h = LOGICAL_H;
    view.w = cw / view.scale;

    ctx.setTransform(dpr * view.scale, 0, 0, dpr * view.scale, 0, 0);
    ctx.imageSmoothingEnabled = true;

    // Cap the road at 80% of the visible width so the neon city always frames
    // it — on a tall phone it would otherwise run edge to edge and lose the
    // sense of speed the roadside grid provides.
    road.w = clamp(Math.min(470, view.w * 0.80), 200, 470);
    road.left = (view.w - road.w) / 2;
    road.laneW = road.w / LANES;
    road.carW = Math.min(80, road.laneW * 0.74);

    spriteQ = clamp(view.scale * view.dpr, 1, 2.5);
    sprites = {};
    buildGradients();
    seedCity();
  }

  // Gradients are geometry-dependent but frame-independent — build once per
  // layout instead of reallocating five of them every frame.
  var grad = {};
  function buildGradients() {
    var W = view.w, H = view.h, L = road.left, RW = road.w, spill = 110;

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#120a2c'); g.addColorStop(0.45, '#0a0620'); g.addColorStop(1, '#06040f');
    grad.ground = g;

    var lg = ctx.createLinearGradient(L - spill, 0, L, 0);
    lg.addColorStop(0, 'rgba(34,230,255,0)'); lg.addColorStop(1, 'rgba(34,230,255,0.13)');
    grad.spillL = lg;

    var rg = ctx.createLinearGradient(L + RW + spill, 0, L + RW, 0);
    rg.addColorStop(0, 'rgba(34,230,255,0)'); rg.addColorStop(1, 'rgba(34,230,255,0.13)');
    grad.spillR = rg;

    var vg = ctx.createLinearGradient(0, 0, 0, H);
    vg.addColorStop(0, 'rgba(0,0,0,0.5)'); vg.addColorStop(0.35, 'rgba(0,0,0,0)');
    grad.roadTop = vg;

    var sc = ctx.createLinearGradient(0, 0, 0, 190);
    sc.addColorStop(0, 'rgba(4,2,12,0.82)');
    sc.addColorStop(0.6, 'rgba(4,2,12,0.34)');
    sc.addColorStop(1, 'rgba(4,2,12,0)');
    grad.hudScrim = sc;
  }

  function laneX(i) { return road.left + road.laneW * (i + 0.5); }

  /* ---- roadside city: top-down blocks that scroll past with parallax.
     They only exist where there is room beside the road, so a narrow phone
     falls back to the grid + pylons and a 16:9 window fills out properly. ---- */
  var BLOCK_TINTS = ['#2ad4ff', '#ff5ec8', '#a678ff', '#4ef2b0'];

  function sideZone(side) {
    var m = 18;
    return side === 'left'
      ? { a: -30, b: road.left - m }
      : { a: road.left + road.w + m, b: view.w + 30 };
  }

  function makeBlock(side, y) {
    var z = sideZone(side);
    var zw = z.b - z.a;
    var w = clamp(rnd(zw * 0.26, zw * 0.62), 44, 165);
    var h = rnd(58, 135);
    var x = rnd(z.a, Math.max(z.a, z.b - w));
    // window grid rather than random scatter — reads as a building from above
    var dots = [];
    var cols = Math.max(2, Math.round(w / 15));
    var rows = Math.max(2, Math.round(h / 15));
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        if (Math.random() < 0.42) dots.push([(c + 0.5) / cols, (r + 0.5) / rows]);
      }
    }
    return {
      x: x, y: y, w: w, h: h, dots: dots,
      tint: pick(BLOCK_TINTS), lit: Math.random() < 0.28
    };
  }

  function seedCity() {
    blocks.left = []; blocks.right = [];
    ['left', 'right'].forEach(function (side) {
      var z = sideZone(side);
      if (z.b - z.a < 105) return;             // no room — grid + pylons only
      var y = -300, guard = 0;
      while (y < view.h + 340 && guard++ < 60) {
        var b = makeBlock(side, y);
        blocks[side].push(b);
        y += b.h + rnd(26, 80);
      }
    });
  }

  /* =========================================================================
     6. GAME STATE
     ========================================================================= */
  var S = {
    mode: 'menu',        // menu | play | dead | paused
    tier: TIERS[1],
    time: 0,
    speed: 600,
    scroll: 0,
    score: 0,
    combo: 1,
    comboTimer: 0,
    energy: 0,
    boostT: 0,
    lives: 3,
    maxLives: 5,
    invuln: 0,
    hitsTaken: 0,
    livesGained: 0,
    dist: 0,
    nearMisses: 0,
    orbsGot: 0,
    shake: 0,
    slowmo: 1,
    deathT: 0,
    flash: 0,
    hurtFlash: 0,
    boostFlash: 0,
    spawnT: 0.9,
    orbT: 3.2,
    lifeT: 46,
    lastWave: null,
    tipsShown: {},
    ents: [],
    parts: [],
    floats: [],
    toasts: []
  };

  var player = { lane: 1, x: 0, targetX: 0, fromX: 0, shiftT: 1, tilt: 0, prevX: 0, alive: true };
  var boostBtn = { x: 0, y: 0, r: 74, pulse: 0 };
  var lastDt = 1 / 60;   // world delta for the frame currently being drawn

  function resetRun() {
    var T = tierById(Store.data.tier);
    S.tier = T;
    S.time = 0; S.speed = T.base; S.score = 0; S.combo = 1; S.comboTimer = 0;
    S.energy = 0; S.boostT = 0; S.dist = 0;
    S.lives = T.lives; S.maxLives = T.maxLives; S.invuln = 0;
    S.hitsTaken = 0; S.livesGained = 0;
    S.nearMisses = 0; S.orbsGot = 0; S.shake = 0; S.slowmo = 1; S.deathT = 0;
    S.flash = 0; S.hurtFlash = 0; S.boostFlash = 0;
    S.spawnT = 1.0; S.orbT = 4.0; S.lastWave = null;
    S.lifeT = rnd(T.lifeEvery[0], T.lifeEvery[1]);
    S.tipsShown = {};
    S.ents.length = 0; S.parts.length = 0; S.floats.length = 0; S.toasts.length = 0;
    player.lane = 1;
    player.x = laneX(1); player.targetX = player.x; player.fromX = player.x;
    player.shiftT = 1; player.tilt = 0; player.alive = true;
  }

  /* ---- toasts: how new mechanics get introduced ---- */
  function toast(id, text) {
    if (S.tipsShown[id]) return;
    S.tipsShown[id] = true;
    S.toasts.push({ text: text, life: 2.6, max: 2.6 });
  }

  function floatText(x, y, text, color, size) {
    S.floats.push({ x: x, y: y, text: text, color: color, life: 0.9, size: size || 26 });
  }

  function burst(x, y, color, n, spread, speed) {
    for (var i = 0; i < n; i++) {
      var a = rnd(0, Math.PI * 2);
      var s = rnd(speed * 0.35, speed);
      S.parts.push({
        x: x + rnd(-spread, spread), y: y + rnd(-spread, spread),
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
        life: rnd(0.35, 0.85), max: 0.85, size: rnd(2.4, 6), color: color
      });
    }
  }

  /* =========================================================================
     7. INPUT
     ========================================================================= */
  function shiftLane(dir) {
    if (S.mode !== 'play' || !player.alive) return;
    var next = clamp(player.lane + dir, 0, LANES - 1);
    if (next === player.lane) return;
    player.lane = next;
    player.fromX = player.x;
    player.targetX = laneX(next);
    player.shiftT = 0;
    Sound.blip(300 + dir * 40, 0.05, 'square', 0.06);
  }

  function tryBoost() {
    if (S.mode !== 'play' || !player.alive) return;
    if (S.energy < 100 || S.boostT > 0) return;
    S.energy = 0;
    S.boostT = BOOST_TIME;
    S.boostFlash = 1;
    S.shake = Math.max(S.shake, 10);
    Sound.boost();
    floatText(player.x, view.h * PLAYER_Y - 90, 'BOOST!', '#8ff8ff', 34);
  }

  var ptr = { id: null, x0: 0, y0: 0, t0: 0, moved: false, lastShift: 0 };

  function localPoint(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / view.scale, y: (e.clientY - r.top) / view.scale };
  }

  canvas.addEventListener('pointerdown', function (e) {
    Sound.boot(); Sound.resumeCtx();
    if (S.mode !== 'play') return;
    var p = localPoint(e);
    ptr.id = e.pointerId; ptr.x0 = p.x; ptr.y0 = p.y; ptr.t0 = performance.now();
    ptr.moved = false; ptr.lastShift = p.x;

    var dx = p.x - boostBtn.x, dy = p.y - boostBtn.y;
    if (S.energy >= 100 && S.boostT <= 0 && dx * dx + dy * dy < boostBtn.r * boostBtn.r) {
      ptr.id = null;
      tryBoost();
      e.preventDefault();
      return;
    }
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('pointermove', function (e) {
    if (ptr.id !== e.pointerId) return;
    var p = localPoint(e);
    if (Math.abs(p.x - ptr.lastShift) > road.laneW * 0.55) {
      shiftLane(p.x > ptr.lastShift ? 1 : -1);
      ptr.lastShift = p.x;
      ptr.moved = true;
    }
  });

  function endPointer(e) {
    if (ptr.id !== e.pointerId) return;
    var p = localPoint(e);
    if (!ptr.moved && performance.now() - ptr.t0 < 400) {
      shiftLane(p.x < view.w / 2 ? -1 : 1);
    }
    ptr.id = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function (e) { if (ptr.id === e.pointerId) ptr.id = null; });

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { shiftLane(-1); e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { shiftLane(1); e.preventDefault(); }
    else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
      if (S.mode === 'play') { tryBoost(); e.preventDefault(); }
      else if (S.mode === 'menu') { startRun(); e.preventDefault(); }
      else if (S.mode === 'dead') { startRun(); e.preventDefault(); }
    } else if (k === 'Escape' || k === 'p' || k === 'P') {
      if (S.mode === 'play') pauseGame(true); else if (S.mode === 'paused') resumeGame();
    } else if (k === 'm' || k === 'M') { toggleMute(); }
  });

  /* =========================================================================
     8. SPAWNING — waves, with guaranteed gaps and staged mechanics
     ========================================================================= */
  function speedAt(t) {
    var T = S.tier;
    return T.base + T.gain * (1 - Math.exp(-t / T.tau)) + Math.min(t * T.creep, T.creepMax);
  }

  function laneOccupiedNear(lane, y, pad) {
    for (var i = 0; i < S.ents.length; i++) {
      var e = S.ents[i];
      if (e.dead) continue;
      if (e.kind === 'barrier') {
        if ((lane === e.lane || lane === e.lane + 1) && Math.abs(e.y - y) < pad) return true;
      } else if (e.lane === lane && Math.abs(e.y - y) < pad) return true;
    }
    return false;
  }

  function spawnWave() {
    var t = S.time;
    var T = S.tier;
    var maxBlock = t < T.waveAt[0] ? 1 : (t < T.waveAt[2] ? 2 : 3);
    var count = rndi(1, maxBlock);
    if (count === 3 && S.lastWave === 3) count = 2;      // never two brutal waves back to back
    S.lastWave = count;

    var open = [0, 1, 2, 3];
    var chosen = [];
    for (var i = 0; i < count && open.length > 1; i++) {
      var idx = Math.floor(Math.random() * open.length);
      chosen.push(open[idx]);
      open.splice(idx, 1);
    }

    var y = -170;
    var useBarrier = t > T.barrierAt && chosen.length >= 2 && Math.random() < 0.3;
    if (useBarrier) {
      // find two adjacent lanes among the chosen set
      chosen.sort(function (a, b) { return a - b; });
      var pairAt = -1;
      for (var j = 0; j < chosen.length - 1; j++) { if (chosen[j + 1] === chosen[j] + 1) { pairAt = chosen[j]; break; } }
      if (pairAt >= 0) {
        toast('barrier', 'BARRIERS — TWO LANES BLOCKED');
        S.ents.push({
          kind: 'barrier', lane: pairAt, y: y, h: 44,
          x: laneX(pairAt) + road.laneW * 0.5, w: road.laneW * 2 - 12, dead: false
        });
        chosen = chosen.filter(function (l) { return l !== pairAt && l !== pairAt + 1; });
      }
    }

    for (var k = 0; k < chosen.length; k++) {
      var lane = chosen[k];
      var ci = Math.floor(Math.random() * TRAFFIC_COLORS.length);
      var col = TRAFFIC_COLORS[ci];
      var drifts = t > T.driftAt && Math.random() < T.driftOdds;
      var dir = 0;
      if (drifts) {
        dir = lane === 0 ? 1 : (lane === LANES - 1 ? -1 : (Math.random() < 0.5 ? -1 : 1));
        toast('drift', 'DRIFTERS — THEY CHANGE LANES');
      }
      S.ents.push({
        kind: 'car', lane: lane, x: laneX(lane), y: y + rnd(-18, 18),
        w: road.carW, h: road.carW * 1.62,
        frac: rnd(T.frac[0], T.frac[1]), col: col, ci: ci, passed: false, dead: false,
        drift: dir, driftT: drifts ? rnd(0.45, 1.1) : 0, driftFrom: laneX(lane), driftProg: 0,
        wob: rnd(0, 6.28)
      });
    }
  }

  function spawnOrb() {
    var lane = rndi(0, LANES - 1);
    if (laneOccupiedNear(lane, -150, 210)) return;
    toast('orb', 'GRAB ENERGY TO CHARGE BOOST');
    S.ents.push({ kind: 'orb', lane: lane, x: laneX(lane), y: -140, w: 40, h: 40, spin: 0, dead: false });
  }

  function spawnLife() {
    var lane = rndi(0, LANES - 1);
    if (laneOccupiedNear(lane, -150, 230)) return;
    toast('life', 'REPAIR CELL — RESTORES A LIFE');
    S.ents.push({ kind: 'life', lane: lane, x: laneX(lane), y: -140, w: 46, h: 46, spin: 0, dead: false });
  }

  /* =========================================================================
     9. UPDATE
     ========================================================================= */
  function update(dt) {
    if (S.mode === 'dead') {
      // Death beat: the world keeps rolling in slow motion for ~0.85s of real
      // time while the wreck plays out, then the card comes up.
      S.deathT += dt;
      S.slowmo = lerp(S.slowmo, 0.16, Math.min(1, dt * 5));
      var sdt = dt * S.slowmo;
      lastDt = sdt;
      S.scroll += S.speed * sdt;
      for (var d = S.ents.length - 1; d >= 0; d--) {
        var de = S.ents[d];
        de.y += (de.kind === 'car' ? S.speed * (1 - de.frac) : S.speed) * sdt;
        if (de.y > view.h + 260) S.ents.splice(d, 1);
      }
      updateFx(dt, sdt);
      if (S.deathT > 0.85 && !gameOverShown) showGameOver();
      return;
    }
    if (S.mode !== 'play') { updateFx(dt, dt); return; }

    S.time += dt;
    S.slowmo = 1;

    // --- speed
    var target = speedAt(S.time) * (S.boostT > 0 ? BOOST_SPEED_MUL : 1);
    S.speed = lerp(S.speed, target, Math.min(1, dt * (S.boostT > 0 ? 5 : 2)));
    S.scroll += S.speed * dt;
    S.dist += S.speed * dt;

    // --- boost
    if (S.boostT > 0) {
      S.boostT -= dt;
      if (S.boostT <= 0) { S.boostT = 0; S.shake = Math.max(S.shake, 4); }
    }
    boostBtn.pulse += dt * 4;

    // --- combo decay
    if (S.combo > 1) {
      S.comboTimer -= dt;
      if (S.comboTimer <= 0) { S.combo = 1; }
    }

    // --- score. The tier multiplier is what keeps the three best-scores
    //     meaningfully separate rather than just "slower tier, lower number".
    var mul = (S.boostT > 0 ? 2 : 1) * S.combo * S.tier.scoreMul;
    S.score += S.speed * dt * 0.1 * mul;

    // --- player lane tween; tilt follows actual lateral velocity so it banks
    //     into the move and settles instead of snapping to a fixed angle
    player.prevX = player.x;
    if (player.shiftT < 1) {
      player.shiftT = Math.min(1, player.shiftT + dt / LANE_SHIFT_TIME);
      var e = 1 - Math.pow(1 - player.shiftT, 3);
      player.x = lerp(player.fromX, player.targetX, e);
    } else {
      player.x = player.targetX;
    }
    var vx = dt > 0 ? (player.x - player.prevX) / dt : 0;
    player.tilt = lerp(player.tilt, clamp(vx * 0.00016, -0.17, 0.17), Math.min(1, dt * 14));

    // --- spawn director
    S.spawnT -= dt;
    if (S.spawnT <= 0) {
      spawnWave();
      // gapMul scales the floor as well as the curve, so a tier's density
      // holds all the way into the late game instead of being clamped away.
      var gap = Math.max(0.44, 1.02 - S.time * 0.0062) * S.tier.gapMul * rnd(0.9, 1.22);
      if (S.time < 9) gap *= 1.5;
      S.spawnT = gap;
    }
    S.orbT -= dt;
    if (S.orbT <= 0 && S.time > 5) { spawnOrb(); S.orbT = rnd(2.0, 3.6); }
    S.lifeT -= dt;
    if (S.lifeT <= 0 && S.time > 16) {
      // Only worth spawning if it can actually be used.
      if (S.lives < S.maxLives || Math.random() < 0.4) spawnLife();
      S.lifeT = rnd(S.tier.lifeEvery[0], S.tier.lifeEvery[1]);
    }

    // --- invulnerability after a hit
    if (S.invuln > 0) S.invuln = Math.max(0, S.invuln - dt);

    // --- entities
    var py = view.h * PLAYER_Y;
    var phb = { x: player.x, y: py, w: road.carW * S.tier.forgive, h: road.carW * 1.62 * 0.76 };

    for (var i = S.ents.length - 1; i >= 0; i--) {
      var en = S.ents[i];
      var rel = (en.kind === 'car') ? S.speed * (1 - en.frac) : S.speed;
      en.y += rel * dt;

      if (en.kind === 'car' && en.drift) {
        en.driftT -= dt;
        if (en.driftT <= 0 && en.driftProg < 1) {
          en.driftProg = Math.min(1, en.driftProg + dt / 0.85);
          var tgt = laneX(clamp(en.lane + en.drift, 0, LANES - 1));
          en.x = lerp(en.driftFrom, tgt, 1 - Math.pow(1 - en.driftProg, 2));
          if (en.driftProg >= 1) { en.lane = clamp(en.lane + en.drift, 0, LANES - 1); en.drift = 0; }
        }
      }
      if (en.kind === 'orb' || en.kind === 'life') en.spin += dt * 3.4;

      if (en.y > view.h + 260) { S.ents.splice(i, 1); continue; }
      if (en.dead) { S.ents.splice(i, 1); continue; }

      // --- collisions
      var hb;
      if (en.kind === 'barrier') hb = { x: en.x, y: en.y, w: en.w * 0.94, h: en.h * 0.9 };
      else if (en.kind === 'car') hb = { x: en.x, y: en.y, w: en.w * 0.7, h: en.h * 0.78 };
      else hb = { x: en.x, y: en.y, w: en.w * 0.95, h: en.h * 0.95 };

      var hit = Math.abs(hb.x - phb.x) < (hb.w + phb.w) / 2 &&
                Math.abs(hb.y - phb.y) < (hb.h + phb.h) / 2;

      if (hit && player.alive) {
        if (en.kind === 'orb') {
          en.dead = true;
          S.orbsGot++;
          S.energy = Math.min(100, S.energy + ORB_ENERGY);
          S.combo = Math.min(9, S.combo + 1); S.comboTimer = 4;
          S.score += 40 * S.combo;
          burst(en.x, en.y, '#8ff8ff', 12, 8, 260);
          floatText(en.x, en.y - 24, '+' + (40 * S.combo), '#8ff8ff', 22);
          Sound.pickup(S.combo);
          if (S.energy >= 100) toast('boostready', 'BOOST READY — TAP THE RING');
          continue;
        }
        if (en.kind === 'life') {
          en.dead = true;
          if (S.lives < S.maxLives) {
            S.lives++;
            S.livesGained++;
            burst(en.x, en.y, '#6dffb0', 22, 10, 320);
            floatText(en.x, en.y - 26, '+1 LIFE', '#6dffb0', 26);
            Sound.lifeUp();
          } else {
            // Already full — pay out instead of wasting the pickup.
            var bonus = 300 * S.combo;
            S.score += bonus;
            S.energy = 100;
            burst(en.x, en.y, '#6dffb0', 18, 10, 300);
            floatText(en.x, en.y - 26, '+' + bonus, '#6dffb0', 24);
            Sound.lifeUp();
          }
          continue;
        }
        // car or barrier
        if (S.boostT > 0) {
          en.dead = true;
          S.score += 150 * S.combo;
          burst(en.x, en.y, en.kind === 'car' ? en.col[0] : '#ff5ea8', 22, 14, 420);
          floatText(en.x, en.y - 30, '+' + (150 * S.combo), '#ffffff', 24);
          S.shake = Math.max(S.shake, 7);
          Sound.smash();
          continue;
        }
        if (S.invuln > 0) continue;   // still flashing from the last hit
        takeHit(en, py);
        continue;
      }

      // --- near miss scoring (skill reward)
      if (en.kind === 'car' && !en.passed && en.y > py + phb.h * 0.55) {
        en.passed = true;
        if (Math.abs(en.x - player.x) < road.laneW * 1.35) {
          S.nearMisses++;
          S.combo = Math.min(9, S.combo + 1);
          S.comboTimer = 4;
          var pts = 25 * S.combo;
          S.score += pts;
          S.energy = Math.min(100, S.energy + 3);
          floatText(en.x, en.y - 40, '+' + pts, '#ff9ad5', 20);
          Sound.nearMiss();
          if (S.combo >= 4) toast('combo', 'NEAR MISSES BUILD YOUR COMBO');
          if (S.energy >= 100) toast('boostready', 'BOOST READY — TAP THE RING');
        }
      }
    }

    // --- thruster trail
    if (Math.random() < 0.85) {
      S.parts.push({
        x: player.x + rnd(-road.carW * 0.22, road.carW * 0.22),
        y: py + road.carW * 0.86,
        vx: rnd(-24, 24), vy: rnd(180, 340),
        life: rnd(0.16, 0.34), max: 0.34, size: rnd(2, 5),
        color: S.boostT > 0 ? '#ffffff' : '#5fd8ff'
      });
    }

    updateFx(dt, dt);

    var s01 = clamp((S.speed - 600) / 950, 0, 1);
    Sound.drive(s01, true);
    Sound.music(s01, true);
  }

  // dt  = real seconds  -> screen effects decay in real time (never stick)
  // sdt = scaled seconds -> world/particle motion, slowed during the death beat
  function updateFx(dt, sdt) {
    if (sdt == null) sdt = dt;

    S.boostFlash = Math.max(0, S.boostFlash - dt * 2.2);
    S.flash = Math.max(0, S.flash - dt * 3.2);
    S.hurtFlash = Math.max(0, S.hurtFlash - dt * 2.6);
    S.shake = Math.max(0, S.shake - dt * 26);

    for (var i = S.parts.length - 1; i >= 0; i--) {
      var p = S.parts[i];
      p.life -= sdt;
      if (p.life <= 0) { S.parts.splice(i, 1); continue; }
      p.x += p.vx * sdt; p.y += p.vy * sdt; p.vy += 220 * sdt;
    }
    for (var j = S.floats.length - 1; j >= 0; j--) {
      var f = S.floats[j];
      f.life -= dt; f.y -= 58 * dt;
      if (f.life <= 0) S.floats.splice(j, 1);
    }
    for (var k = S.toasts.length - 1; k >= 0; k--) {
      S.toasts[k].life -= dt;
      if (S.toasts[k].life <= 0) S.toasts.splice(k, 1);
    }
  }

  /* A hit costs a life rather than the run. The recovery beat is deliberate:
     the obstacle is destroyed so you can't instantly re-collide, the car sheds
     speed so the next wave is readable, the combo resets, and you get ~2s of
     invulnerability to get your bearings back. */
  function takeHit(en, py) {
    en.dead = true;
    S.lives--;
    S.hitsTaken++;
    S.combo = 1;
    S.comboTimer = 0;
    S.shake = Math.max(S.shake, 18);

    burst(en.x, en.y, en.kind === 'car' ? en.col[0] : '#ff5ea8', 24, 14, 420);
    burst(player.x, py, '#ffffff', 14, 10, 300);

    if (S.lives <= 0) { S.lives = 0; die(); return; }

    S.invuln = INVULN_TIME;
    S.hurtFlash = 1;
    S.speed *= 0.72;                       // stumble, then recover
    floatText(player.x, py - 96, '-1', '#ff6b8f', 32);
    Sound.hurt();
    if (S.lives === 1) toast('lastlife', 'LAST LIFE — FIND A REPAIR CELL');
  }

  function die() {
    if (!player.alive) return;
    player.alive = false;
    S.mode = 'dead';
    S.deathT = 0;
    S.shake = 26;
    S.flash = 1;
    var py = view.h * PLAYER_Y;
    burst(player.x, py, '#ffd66e', 30, 16, 520);
    burst(player.x, py, '#ff5ea8', 26, 18, 420);
    burst(player.x, py, '#ffffff', 16, 10, 320);
    Sound.crash();
    Sound.drive(0, false);
    Sound.music(0, false);
  }

  /* =========================================================================
     10. RENDER
     ========================================================================= */
  function render() {
    var W = view.w, H = view.h;

    ctx.save();
    if (S.shake > 0.2) {
      ctx.translate(rnd(-S.shake, S.shake) * 0.45, rnd(-S.shake, S.shake) * 0.45);
    }

    drawBackground(W, H);
    drawRoad(W, H);
    drawEntities();
    // The menu sits over the road; a parked car under the copy just competes
    // with it, so the road runs empty until a run starts.
    if (player.alive && S.mode !== 'menu') drawPlayer();
    drawParticles();
    ctx.restore();

    drawHud(W, H);

    // Losing a life reads red at the edges; a wreck is a white-out. Different
    // colour and different shape, so you never confuse the two.
    if (S.hurtFlash > 0.01) {
      ctx.save();
      ctx.globalAlpha = S.hurtFlash * 0.85;
      var vg = ctx.createRadialGradient(W / 2, H * 0.6, Math.min(W, H) * 0.22, W / 2, H * 0.6, Math.max(W, H) * 0.72);
      vg.addColorStop(0, 'rgba(255,40,90,0)');
      vg.addColorStop(1, 'rgba(255,40,90,0.62)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    if (S.flash > 0.01) {
      ctx.fillStyle = 'rgba(255,255,255,' + (S.flash * 0.5) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (S.boostT > 0) drawSpeedLines(W, H);
  }

  function drawBackground(W, H) {
    // Ground. Top-down, so there is no horizon line — just city floor that
    // gets a little more light near the road.
    ctx.fillStyle = grad.ground;
    ctx.fillRect(0, 0, W, H);

    // --- scrolling ground grid (the main speed cue on the sides)
    var period = 96;
    var off = (S.scroll * 0.55) % period;
    ctx.strokeStyle = 'rgba(96,62,190,0.26)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var y = off - period; y < H + period; y += period) {
      ctx.moveTo(0, y); ctx.lineTo(road.left - 8, y);
      ctx.moveTo(road.left + road.w + 8, y); ctx.lineTo(W, y);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(74,48,155,0.20)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var x = road.left - 8; x > -78; x -= 78) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (var x2 = road.left + road.w + 8; x2 < W + 78; x2 += 78) { ctx.moveTo(x2, 0); ctx.lineTo(x2, H); }
    ctx.stroke();

    // --- city blocks, parallaxed behind the action
    drawCity(W, H);

    // --- glow spilling off the road onto the ground
    var spill = 110;
    ctx.fillStyle = grad.spillL;
    ctx.fillRect(road.left - spill, 0, spill, H);
    ctx.fillStyle = grad.spillR;
    ctx.fillRect(road.left + road.w, 0, spill, H);

    // --- roadside pylons
    var pp = 240;
    var poff = (S.scroll * 1.0) % pp;
    for (var py2 = poff - pp; py2 < H + pp; py2 += pp) {
      drawPylon(road.left - 20, py2);
      drawPylon(road.left + road.w + 20, py2);
    }
  }

  function drawCity(W, H) {
    var sides = ['left', 'right'];
    for (var s = 0; s < sides.length; s++) {
      var list = blocks[sides[s]];
      for (var i = 0; i < list.length; i++) {
        var b = list[i];
        b.y += S.speed * 0.72 * lastDt;
        if (b.y > H + 340) {
          // recycle above the current topmost block, leaving a clean gap
          var top = Infinity;
          for (var k = 0; k < list.length; k++) top = Math.min(top, list[k].y);
          var nb = makeBlock(sides[s], 0);
          nb.y = top - nb.h - rnd(26, 80);
          list[i] = nb;
          b = nb;
        }
        if (b.y + b.h < -40 || b.y > H + 40) continue;

        ctx.save();
        ctx.fillStyle = b.lit ? 'rgba(20,14,44,0.95)' : 'rgba(11,8,28,0.95)';
        roundRect(ctx, b.x, b.y, b.w, b.h, 5);
        ctx.fill();

        ctx.globalAlpha = b.lit ? 0.62 : 0.34;
        ctx.strokeStyle = b.tint;
        ctx.lineWidth = 1.4;
        roundRect(ctx, b.x + 0.7, b.y + 0.7, b.w - 1.4, b.h - 1.4, 5);
        ctx.stroke();

        ctx.globalAlpha = b.lit ? 0.8 : 0.5;
        ctx.fillStyle = b.tint;
        for (var d = 0; d < b.dots.length; d++) {
          ctx.fillRect(b.x + b.w * b.dots[d][0] - 1.5, b.y + b.h * b.dots[d][1] - 1.5, 3, 3);
        }
        ctx.restore();
      }
    }
  }

  function drawPylon(x, y) {
    var s = sprite('pylon', 40, 70, function (c, w, h) {
      c.shadowColor = '#ff4fd8';
      c.shadowBlur = 16;
      c.fillStyle = '#ff4fd8';
      c.fillRect(w / 2 - 2.5, h / 2 - 17, 5, 34);
    });
    blit(s, x, y + 17);
  }

  function drawRoad(W, H) {
    var L = road.left, RW = road.w;

    ctx.fillStyle = '#0b0a18';
    ctx.fillRect(L, 0, RW, H);

    // glowing edges — one tall pre-rendered strip, blitted twice
    var edge = sprite('edge', 44, 256, function (c, w, h) {
      c.shadowColor = '#22e6ff';
      c.shadowBlur = 20;
      c.fillStyle = '#22e6ff';
      c.fillRect(w / 2 - 2.5, -10, 5, h + 20);
    });
    for (var ey = 0; ey < H; ey += 256) {
      blit(edge, L - 0.5, ey + 128);
      blit(edge, L + RW + 0.5, ey + 128);
    }

    // scrolling lane dividers — one dash sprite tiled down each divider
    var seg = 78, gap = 54, period = seg + gap;
    var off = S.scroll % period;
    var dash = sprite('dash', 34, seg + 26, function (c, w, h) {
      c.shadowColor = '#c05cff';
      c.shadowBlur = 11;
      c.fillStyle = 'rgba(203,128,255,0.9)';
      c.fillRect(w / 2 - 2, (h - seg) / 2, 4, seg);
    });
    for (var i = 1; i < LANES; i++) {
      var x = L + road.laneW * i;
      for (var y = off - period; y < H + period; y += period) {
        blit(dash, x, y + seg / 2);
      }
    }

    // subtle vignette on the road for depth
    ctx.fillStyle = grad.roadTop;
    ctx.fillRect(L, 0, RW, H);
  }

  var GLOW_PAD = 30;

  // Traffic: blunt, boxy, warm-coloured. One sprite per colour per size.
  function drawTrafficCar(x, y, w, h, ci) {
    var col = TRAFFIC_COLORS[ci];
    var s = sprite('traffic' + ci, w + GLOW_PAD * 2, h + GLOW_PAD * 2, function (c, SW, SH) {
      c.translate(SW / 2, SH / 2);
      c.shadowColor = col[0];
      c.shadowBlur = 20;
      var g = c.createLinearGradient(0, -h / 2, 0, h / 2);
      g.addColorStop(0, col[0]);
      g.addColorStop(1, col[1]);
      c.fillStyle = g;
      roundRect(c, -w / 2, -h / 2, w, h, w * 0.22);
      c.fill();
      c.shadowBlur = 0;

      c.fillStyle = 'rgba(6,10,26,0.86)';
      roundRect(c, -w * 0.31, -h * 0.20, w * 0.62, h * 0.34, w * 0.12);
      c.fill();

      c.fillStyle = 'rgba(255,255,255,0.14)';
      c.fillRect(-w * 0.05, -h * 0.44, w * 0.10, h * 0.86);

      // tail lights face us — we are overtaking them
      c.globalAlpha = 0.95;
      c.fillStyle = '#ff5a5a';
      c.shadowColor = '#ff3b3b'; c.shadowBlur = 10;
      roundRect(c, -w * 0.37, h / 2 - 10, w * 0.24, 5, 2.5); c.fill();
      roundRect(c, w * 0.13, h / 2 - 10, w * 0.24, 5, 2.5); c.fill();
    });
    blit(s, x, y);
  }

  // Player: a tapered arrow silhouette with a hard white rim — a different
  // shape as well as a different colour, so it reads instantly.
  function drawPlayerCar(x, y, w, h, boosting) {
    var s = sprite('player' + (boosting ? 'B' : 'N'), w + GLOW_PAD * 2, h + GLOW_PAD * 2, function (c, SW, SH) {
      c.translate(SW / 2, SH / 2);
      var hw = w / 2, hh = h / 2, nose = w * 0.34;
      function body() {
        c.beginPath();
        c.moveTo(0, -hh - h * 0.06);
        c.quadraticCurveTo(nose, -hh + h * 0.04, hw, -hh + h * 0.30);
        c.lineTo(hw, hh - w * 0.18);
        c.quadraticCurveTo(hw, hh, hw - w * 0.18, hh);
        c.lineTo(-hw + w * 0.18, hh);
        c.quadraticCurveTo(-hw, hh, -hw, hh - w * 0.18);
        c.lineTo(-hw, -hh + h * 0.30);
        c.quadraticCurveTo(-nose, -hh + h * 0.04, 0, -hh - h * 0.06);
        c.closePath();
      }

      c.shadowColor = boosting ? '#ffffff' : '#45dcff';
      c.shadowBlur = boosting ? 32 : 22;
      var g = c.createLinearGradient(0, -hh, 0, hh);
      g.addColorStop(0, boosting ? '#ffffff' : '#bdf6ff');
      g.addColorStop(0.45, boosting ? '#9bf0ff' : '#4fc8ff');
      g.addColorStop(1, boosting ? '#3fa8ff' : '#0f5fb8');
      c.fillStyle = g;
      body(); c.fill();

      c.shadowBlur = 0;
      c.strokeStyle = 'rgba(255,255,255,0.92)';
      c.lineWidth = 2.2;
      body(); c.stroke();

      c.fillStyle = 'rgba(4,10,28,0.86)';
      roundRect(c, -w * 0.27, -h * 0.16, w * 0.54, h * 0.32, w * 0.13);
      c.fill();
      c.fillStyle = 'rgba(180,240,255,0.30)';
      roundRect(c, -w * 0.22, -h * 0.13, w * 0.44, h * 0.10, w * 0.08);
      c.fill();

      c.fillStyle = 'rgba(255,255,255,0.30)';
      c.fillRect(-w * 0.06, -h * 0.40, w * 0.12, h * 0.20);

      c.fillStyle = boosting ? '#ffffff' : '#8ff8ff';
      c.shadowColor = boosting ? '#ffffff' : '#8ff8ff';
      c.shadowBlur = 16;
      roundRect(c, -w * 0.34, hh - 7, w * 0.22, 6, 3); c.fill();
      roundRect(c, w * 0.12, hh - 7, w * 0.22, 6, 3); c.fill();
    });
    blit(s, x, y);
  }

  function drawEntities() {
    for (var i = 0; i < S.ents.length; i++) {
      var e = S.ents[i];
      if (e.y < -260 || e.y > view.h + 260) continue;

      if (e.kind === 'car') {
        drawTrafficCar(e.x, e.y, e.w, e.h, e.ci);
        if (e.drift) {
          // blinking turn indicator telegraphs the lane change
          var blink = (Math.sin(S.time * 14) + 1) / 2;
          ctx.save();
          ctx.globalAlpha = 0.35 + blink * 0.65;
          ctx.fillStyle = '#ffd66e';
          ctx.shadowColor = '#ffd66e'; ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.arc(e.x + e.drift * e.w * 0.72, e.y, 6, 0, 6.2832);
          ctx.fill();
          ctx.restore();
        }
      } else if (e.kind === 'barrier') {
        ctx.save();
        ctx.shadowColor = '#ff2e6e'; ctx.shadowBlur = 24;
        var bg = ctx.createLinearGradient(0, e.y - e.h / 2, 0, e.y + e.h / 2);
        bg.addColorStop(0, '#ff5e8f'); bg.addColorStop(1, '#8d0a2c');
        ctx.fillStyle = bg;
        roundRect(ctx, e.x - e.w / 2, e.y - e.h / 2, e.w, e.h, 9);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(10,4,14,0.55)';
        for (var s = -e.w / 2 + 8; s < e.w / 2 - 6; s += 26) {
          ctx.save();
          ctx.translate(e.x + s, e.y);
          ctx.transform(1, 0, -0.5, 1, 0, 0);
          ctx.fillRect(0, -e.h / 2 + 4, 11, e.h - 8);
          ctx.restore();
        }
        ctx.restore();
      } else if (e.kind === 'orb') {
        drawGem('orb', e.x, e.y, 17 + Math.sin(S.time * 5 + e.spin) * 2, 17, e.spin, '#8ff8ff', '#1b8fd0');
      } else if (e.kind === 'life') {
        drawRepairCell(e.x, e.y, 1 + Math.sin(S.time * 5 + e.spin) * 0.05);
      }
    }
  }

  /* Repair cell. Deliberately NOT a gem: the energy orb is a spinning cyan
     hexagon, this is an upright mint-green cell with a cross. Different shape,
     different hue, different motion — no chance of grabbing the wrong one. */
  function drawRepairCell(x, y, pulse) {
    var s = sprite('repair', 108, 108, function (c, SW, SH) {
      c.translate(SW / 2, SH / 2);
      var R = 22;
      c.shadowColor = '#4dffa0';
      c.shadowBlur = 26;
      var g = c.createLinearGradient(0, -R, 0, R);
      g.addColorStop(0, '#c9ffe4');
      g.addColorStop(0.5, '#4dffa0');
      g.addColorStop(1, '#0f9c5c');
      c.fillStyle = g;
      roundRect(c, -R, -R, R * 2, R * 2, 8);
      c.fill();
      c.shadowBlur = 0;

      c.strokeStyle = 'rgba(255,255,255,0.9)';
      c.lineWidth = 2;
      roundRect(c, -R + 1, -R + 1, R * 2 - 2, R * 2 - 2, 7);
      c.stroke();

      // cross
      c.fillStyle = '#07321f';
      var t = 6.5, arm = 13;
      roundRect(c, -t / 2, -arm, t, arm * 2, 2); c.fill();
      roundRect(c, -arm, -t / 2, arm * 2, t, 2); c.fill();
    });
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(pulse, pulse);
    ctx.drawImage(s.cv, -s.w / 2, -s.h / 2, s.w, s.h);
    ctx.restore();
  }

  // Cached at a base radius; the pulse is applied as a cheap scale on blit.
  function drawGem(key, x, y, r, base, spin, bright, deep) {
    var s = sprite('gem' + key, base * 2 + 56, base * 2 + 56, function (c, SW, SH) {
      c.translate(SW / 2, SH / 2);
      c.shadowColor = bright;
      c.shadowBlur = 24;
      var g = c.createLinearGradient(0, -base, 0, base);
      g.addColorStop(0, bright); g.addColorStop(1, deep);
      c.fillStyle = g;
      c.beginPath();
      for (var i = 0; i < 6; i++) {
        var a = (Math.PI / 3) * i - Math.PI / 2;
        var px = Math.cos(a) * base, py = Math.sin(a) * base;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath();
      c.fill();
      c.shadowBlur = 0;
      c.fillStyle = 'rgba(255,255,255,0.5)';
      c.beginPath();
      c.arc(-base * 0.22, -base * 0.26, base * 0.24, 0, 6.2832);
      c.fill();
    });
    var k = r / base;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(spin);
    ctx.drawImage(s.cv, -s.w * k / 2, -s.h * k / 2, s.w * k, s.h * k);
    ctx.restore();
  }

  function drawPlayer() {
    var py = view.h * PLAYER_Y;
    var w = road.carW, h = road.carW * 1.62;

    // Post-hit invulnerability: a fading ring plus a blink on the car itself,
    // so it is obvious both that you are safe and that it is running out.
    if (S.invuln > 0) {
      var k = S.invuln / INVULN_TIME;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,120,150,' + (0.25 + k * 0.55) + ')';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff6b8f'; ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.ellipse(player.x, py, w * (0.88 + (1 - k) * 0.12), h * (0.64 + (1 - k) * 0.08), 0, 0, 6.2832);
      ctx.stroke();
      ctx.restore();
    }

    // boost aura
    if (S.boostT > 0) {
      ctx.save();
      ctx.globalAlpha = 0.55;
      var ag = ctx.createRadialGradient(player.x, py, 6, player.x, py, w * 2.1);
      ag.addColorStop(0, 'rgba(160,250,255,0.7)');
      ag.addColorStop(1, 'rgba(160,250,255,0)');
      ctx.fillStyle = ag;
      ctx.fillRect(player.x - w * 2.2, py - h * 2, w * 4.4, h * 4);
      ctx.restore();
    }

    ctx.save();
    // blink while invulnerable — faster as it runs out
    if (S.invuln > 0) {
      var rate = 14 + (1 - S.invuln / INVULN_TIME) * 16;
      ctx.globalAlpha = 0.45 + 0.55 * ((Math.sin(S.time * rate) + 1) / 2);
    }
    ctx.translate(player.x, py);
    ctx.rotate(player.tilt);
    ctx.translate(-player.x, -py);
    drawPlayerCar(player.x, py, w, h, S.boostT > 0);
    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < S.parts.length; i++) {
      var p = S.parts[i];
      var a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawSpeedLines(W, H) {
    ctx.save();
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var i = 0; i < 22; i++) {
      var x = ((i * 137 + (S.scroll * 0.4)) % (W + 60)) - 30;
      var y = ((i * 331 + S.scroll * 2.6) % (H + 200)) - 100;
      ctx.moveTo(x, y); ctx.lineTo(x, y + 78);
    }
    ctx.stroke();
    ctx.restore();
  }

  /* ---- HUD (canvas-drawn so it scales with the play field) ---- */
  function drawHud(W, H) {
    if (S.mode === 'menu') return;

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    // scrim so the score stays readable when traffic streams in underneath it
    ctx.fillStyle = grad.hudScrim;
    ctx.fillRect(0, 0, W, 190);

    // score
    ctx.shadowColor = 'rgba(80,220,255,0.85)';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 62px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText(fmt(S.score), W / 2, 26);
    ctx.shadowBlur = 0;

    ctx.font = '700 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = 'rgba(180,215,240,0.8)';
    ctx.fillText('BEST  ' + fmt(Store.best()), W / 2, 96);

    drawLives(W);

    // combo
    if (S.combo > 1) {
      var pulse = 1 + Math.sin(S.time * 9) * 0.06;
      ctx.save();
      ctx.translate(W / 2, 138);
      ctx.scale(pulse, pulse);
      ctx.shadowColor = '#ff6bd6'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#ff9ad5';
      ctx.font = '900 30px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.fillText('x' + S.combo, 0, 0);
      ctx.restore();
    }

    // toasts
    if (S.toasts.length) {
      var tt = S.toasts[0];
      var a = clamp(tt.life > tt.max - 0.3 ? (tt.max - tt.life) / 0.3 : Math.min(1, tt.life / 0.5), 0, 1);
      ctx.globalAlpha = a;
      ctx.font = '800 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      var tw = Math.min(ctx.measureText(tt.text).width + 44, W - 24);
      var ty = H * 0.28;
      ctx.fillStyle = 'rgba(6,4,18,0.90)';
      roundRect(ctx, W / 2 - tw / 2, ty, tw, 44, 22);
      ctx.fill();
      ctx.strokeStyle = 'rgba(143,248,255,0.45)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#cdf2ff';
      ctx.fillText(tt.text, W / 2, ty + 13);
      ctx.globalAlpha = 1;
    }

    // floating score popups
    for (var i = 0; i < S.floats.length; i++) {
      var f = S.floats[i];
      ctx.globalAlpha = clamp(f.life / 0.9, 0, 1);
      ctx.fillStyle = f.color;
      ctx.shadowColor = f.color; ctx.shadowBlur = 12;
      ctx.font = '900 ' + f.size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.fillText(f.text, f.x, f.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;

    drawBoostRing(W, H);
    ctx.restore();
  }

  /* Lives, top-left. One chevron per life the tier allows: filled for lives you
     still have, hollow for lost ones — so the ceiling is visible too, which is
     what tells you a repair cell is worth chasing. */
  function drawLives(W) {
    var n = S.maxLives;
    var pitch = n > 5 ? 17 : 19;
    var x0 = 20, y0 = 40;

    var full = sprite('lifeIconOn', 30, 34, function (c, w, h) {
      c.translate(w / 2, h / 2);
      c.shadowColor = '#4dffa0'; c.shadowBlur = 12;
      c.fillStyle = '#8dffc4';
      c.beginPath();
      c.moveTo(0, -9); c.lineTo(6.5, 8); c.lineTo(0, 4.5); c.lineTo(-6.5, 8);
      c.closePath(); c.fill();
    });
    var empty = sprite('lifeIconOff', 30, 34, function (c, w, h) {
      c.translate(w / 2, h / 2);
      c.strokeStyle = 'rgba(140,180,205,0.42)';
      c.lineWidth = 1.6;
      c.beginPath();
      c.moveTo(0, -9); c.lineTo(6.5, 8); c.lineTo(0, 4.5); c.lineTo(-6.5, 8);
      c.closePath(); c.stroke();
    });

    for (var i = 0; i < n; i++) {
      var on = i < S.lives;
      // the life about to be lost pulses when you are down to your last one
      if (on && S.lives === 1) {
        ctx.save();
        ctx.globalAlpha = 0.55 + 0.45 * ((Math.sin(S.time * 8) + 1) / 2);
        blit(full, x0 + i * pitch, y0);
        ctx.restore();
      } else {
        blit(on ? full : empty, x0 + i * pitch, y0);
      }
    }
  }

  function drawBoostRing(W, H) {
    // Keep the ring beside the road rather than pinned to the window corner —
    // on a 16:9 screen a corner-anchored button ends up far from the action.
    boostBtn.r = clamp(Math.min(78, W * 0.17), 52, 78);
    boostBtn.x = Math.min(W - boostBtn.r - 22, road.left + road.w + boostBtn.r * 0.55);
    boostBtn.y = H - boostBtn.r - 34;

    var full = S.energy >= 100;
    var active = S.boostT > 0;
    var pct = active ? (S.boostT / BOOST_TIME) : (S.energy / 100);
    var r = boostBtn.r - 10;

    ctx.save();
    ctx.translate(boostBtn.x, boostBtn.y);

    // dish
    ctx.fillStyle = 'rgba(8,7,24,0.5)';
    ctx.beginPath(); ctx.arc(0, 0, r + 7, 0, 6.2832); ctx.fill();

    // track
    ctx.strokeStyle = 'rgba(130,190,230,0.22)';
    ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.stroke();

    // fill
    var col = active ? '#ffffff' : (full ? '#8ff8ff' : '#3fb7e8');
    ctx.strokeStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = full || active ? 22 : 10;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(0, 0, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(pct, 0, 1));
    ctx.stroke();
    ctx.shadowBlur = 0;

    // core
    if (full && !active) {
      var p = 1 + Math.sin(boostBtn.pulse) * 0.07;
      ctx.save(); ctx.scale(p, p);
      ctx.fillStyle = 'rgba(143,248,255,0.16)';
      ctx.beginPath(); ctx.arc(0, 0, r - 8, 0, 6.2832); ctx.fill();
      ctx.restore();
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = full || active ? '#eafcff' : 'rgba(170,205,230,0.7)';
    ctx.font = '900 ' + Math.round(r * 0.34) + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillText(active ? 'GO' : 'BOOST', 0, 0);
    ctx.restore();
  }

  /* =========================================================================
     11. UI WIRING
     ========================================================================= */
  var ovMenu = document.getElementById('ovMenu');
  var ovOver = document.getElementById('ovOver');
  var ovPause = document.getElementById('ovPause');
  var elFinal = document.getElementById('finalScore');
  var elBest = document.getElementById('bestScore');
  var elRecord = document.getElementById('newRecord');
  var elRunStats = document.getElementById('runStats');
  var elMenuHint = document.getElementById('menuHint');
  var elBestLabel = document.getElementById('bestLabel');
  var elTierPick = document.getElementById('tierPick');
  var elSuggest = document.getElementById('suggestBox');
  var elSuggestMsg = document.getElementById('suggestMsg');
  var btnSuggest = document.getElementById('btnSuggest');
  var btnSound = document.getElementById('btnSound');
  var btnPause = document.getElementById('btnPause');

  var ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>';

  btnPause.innerHTML = ICON_PAUSE;

  function syncSoundIcon() {
    btnSound.innerHTML = (Sound.muted || !Platform.audioAllowed) ? ICON_OFF : ICON_ON;
  }

  function toggleMute() {
    Sound.muted = !Sound.muted;
    Store.data.muted = Sound.muted;
    Store.save();
    Sound.applyVolume();
    syncSoundIcon();
  }

  btnSound.addEventListener('click', function () { Sound.boot(); Sound.resumeCtx(); toggleMute(); });
  btnPause.addEventListener('click', function () {
    if (S.mode === 'play') pauseGame(true);
    else if (S.mode === 'paused') resumeGame();
  });

  var gameOverShown = false;

  function showOverlay(which) {
    ovMenu.hidden = which !== 'menu';
    ovOver.hidden = which !== 'over';
    ovPause.hidden = which !== 'pause';
  }

  /* ---- difficulty picker ---- */
  function buildTierPicker() {
    elTierPick.innerHTML = '';
    TIERS.forEach(function (T) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tier';
      b.setAttribute('role', 'radio');
      b.id = 'tier-' + T.id;
      b.dataset.tier = T.id;
      b.innerHTML = '<span class="tn"></span><span class="tb"></span>';
      b.querySelector('.tn').textContent = T.name;
      b.querySelector('.tb').textContent = T.blurb;
      b.addEventListener('click', function () { setTier(T.id); Sound.boot(); Sound.ui(); });
      elTierPick.appendChild(b);
    });
    syncTierPicker();
  }

  function syncTierPicker() {
    var kids = elTierPick.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].setAttribute('aria-checked', kids[i].dataset.tier === Store.data.tier ? 'true' : 'false');
    }
    syncMenuHint();
  }

  function setTier(id) {
    if (Store.data.tier === id) return;
    Store.data.tier = id;
    Store.data.quickDeaths = 0;   // a fresh tier deserves a fresh read on the player
    Store.save();
    syncTierPicker();
  }

  function syncMenuHint() {
    var T = tierById(Store.data.tier);
    var best = Store.best();
    var lives = T.lives + ' lives';
    elMenuHint.innerHTML = best > 0
      ? '<b>' + T.name + '</b> · ' + lives + ' · best <b>' + fmt(best) + '</b><br>' +
        'Tap the sides to steer · charge the ring to boost'
      : '<b>' + T.name + '</b> · ' + lives + '<br>' +
        'Tap <b>left</b> or <b>right</b> to switch lanes.<br>Collect energy, then fire <b>BOOST</b>.';
  }

  function startRun() {
    Sound.boot(); Sound.resumeCtx();
    gameOverShown = false;
    resetRun();
    S.mode = 'play';
    showOverlay(null);
    Sound.ui();
  }

  function showGameOver() {
    gameOverShown = true;
    var T = S.tier;
    var final = Math.floor(S.score);
    var isRecord = final > Store.best(T.id);
    if (isRecord) Store.data.bests[T.id] = final;
    Store.data.runs++;
    Store.data.seenTips = true;

    // Track how the player is actually coping, so the tier can meet them.
    if (S.time < 24) Store.data.quickDeaths++;
    else Store.data.quickDeaths = 0;

    elFinal.textContent = fmt(final);
    elBest.textContent = fmt(Store.best(T.id));
    elBestLabel.textContent = 'Best · ' + T.name;
    elRecord.hidden = !isRecord;
    elRunStats.textContent =
      Math.round(S.dist / 100) + 'm · ' + S.hitsTaken + ' hits · ' +
      S.nearMisses + ' near misses · ' + S.orbsGot + ' energy' +
      (S.livesGained ? ' · ' + S.livesGained + ' repaired' : '');

    applySuggestion(T);
    Store.save();
    showOverlay('over');
  }

  /* Meets players where they are without making them self-diagnose: a run of
     short runs offers a gentler tier, a strong long run offers a harder one.
     Each direction is offered once so it never nags. */
  var suggestTarget = null;

  function applySuggestion(T) {
    var idx = tierIndex(T.id);
    suggestTarget = null;

    if (Store.data.quickDeaths >= 3 && idx > 0 && !Store.data.offeredDown) {
      suggestTarget = TIERS[idx - 1];
      elSuggestMsg.textContent =
        'Those runs ended early. ' + suggestTarget.name + ' gives you noticeably longer to read the traffic.';
      btnSuggest.textContent = 'Switch to ' + suggestTarget.name;
      Store.data.offeredDown = true;
    } else if (S.time > 95 && S.hitsTaken <= 1 && idx < TIERS.length - 1 && !Store.data.offeredUp) {
      suggestTarget = TIERS[idx + 1];
      elSuggestMsg.textContent =
        'That was a clean run. ' + suggestTarget.name + ' comes at you faster and scores ' +
        suggestTarget.scoreMul + '×.';
      btnSuggest.textContent = 'Try ' + suggestTarget.name;
      Store.data.offeredUp = true;
    }

    elSuggest.hidden = !suggestTarget;
  }

  btnSuggest.addEventListener('click', function () {
    if (!suggestTarget) return;
    setTier(suggestTarget.id);
    startRun();
  });

  function pauseGame(byUser) {
    if (S.mode !== 'play') return;
    S.mode = 'paused';
    Sound.drive(0, false);
    Sound.music(0, false);
    Sound.hardStop();
    showOverlay('pause');
  }

  function resumeGame() {
    if (S.mode !== 'paused') return;
    Sound.resumeCtx();
    Sound.applyVolume();
    S.mode = 'play';
    last = performance.now();
    showOverlay(null);
  }

  function toMenu() {
    S.mode = 'menu';
    resetRun();
    syncTierPicker();
    Sound.drive(0, false);
    Sound.music(0, false);
    showOverlay('menu');
  }

  document.getElementById('btnPlay').addEventListener('click', startRun);
  document.getElementById('btnAgain').addEventListener('click', startRun);
  document.getElementById('btnMenu').addEventListener('click', toMenu);
  document.getElementById('btnResume').addEventListener('click', resumeGame);
  document.getElementById('btnQuit').addEventListener('click', function () {
    S.mode = 'dead'; S.deathT = 1; showGameOver();
  });

  /* =========================================================================
     12. PLATFORM PAUSE / VISIBILITY
     Policy: on pause we stop the loop entirely (no rendering) and silence audio.
     ========================================================================= */
  var hardPaused = false;

  function platformPause() {
    hardPaused = true;
    Sound.hardStop();
    if (S.mode === 'play') pauseGame(false);
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  function platformResume() {
    hardPaused = false;
    Sound.resumeCtx();
    Sound.applyVolume();
    last = performance.now();
    if (!raf) raf = requestAnimationFrame(frame);
  }

  Platform.init(platformPause, platformResume, function () {
    Sound.applyVolume();
    syncSoundIcon();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) platformPause(); else platformResume();
  });
  window.addEventListener('blur', function () { if (S.mode === 'play') pauseGame(false); });

  /* =========================================================================
     13. MAIN LOOP
     ========================================================================= */
  var last = 0, raf = 0, painted = false;

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (hardPaused) return;

    var dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 0.05);
    lastDt = dt;

    if (S.mode === 'paused') return;   // no rendering while paused

    update(dt);
    render();

    if (!painted) {
      painted = true;
      // Order matters: frames are on screen first, and only then do we declare
      // the game interactive. The menu is live the moment it paints.
      Platform.firstFrame();
      Platform.ready();
    }
  }

  /* =========================================================================
     14. BOOT
     ========================================================================= */
  function boot() {
    layout();
    Sound.muted = !!Store.data.muted;
    syncSoundIcon();
    buildTierPicker();
    elBest.textContent = fmt(Store.best());
    resetRun();
    showOverlay('menu');
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    layout();
    if (S.mode !== 'play') { player.x = laneX(player.lane); player.targetX = player.x; player.fromX = player.x; }
    else { player.targetX = laneX(player.lane); if (player.shiftT >= 1) player.x = player.targetX; }
  });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });

  Store.load(boot);
})();
</script>
</body>
</html>
