<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Tower Tilt - a one-tap stacking game about balance - every block shifts your centre of mass, and the tower leans until it goes.">
<meta name="theme-color" content="#1a2f6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a2f6b'/%3E%3Cg transform='rotate(-9 16 27)'%3E%3Crect x='8' y='21' width='16' height='5' rx='1.6' fill='%23ffd166'/%3E%3Crect x='10' y='15' width='16' height='5' rx='1.6' fill='%23ff7b7b'/%3E%3Crect x='7' y='9' width='16' height='5' rx='1.6' fill='%234ee6c8'/%3E%3C/g%3E%3C/svg%3E">
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;background:#1a2f6b}
img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tower Tilt</title>
<style>
  :root{ color-scheme: light; }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:#1a2f6b; color:#0d1b3e; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app{
    position:fixed; inset:0; overflow:hidden; background:#1a2f6b;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #c{ display:block; position:absolute; inset:0; }

  #sysbar{ position:absolute; top:14px; right:14px; z-index:6; display:flex; gap:9px; }
  .sysbtn{
    width:42px; height:42px; border-radius:13px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.26); color:#fff; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:transform .12s ease, background .12s ease;
  }
  .sysbtn:hover{ background:rgba(255,255,255,.4); }
  .sysbtn:active{ transform:scale(.92); }
  .sysbtn svg{ width:20px; height:20px; display:block; }

  .overlay{
    position:absolute; inset:0; z-index:5; padding:24px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:15px;
    text-align:center;
    background:radial-gradient(125% 95% at 50% 44%, rgba(10,22,58,.52) 0%, rgba(6,14,38,.86) 72%);
  }
  .logo{
    font-size:clamp(42px,12.5vmin,80px); font-weight:900; letter-spacing:.01em; line-height:.9;
    margin:0; text-transform:uppercase; color:#fff;
    text-shadow:0 4px 0 rgba(255,122,92,.9), 0 8px 28px rgba(0,0,0,.45);
  }
  .tagline{
    margin:0; font-size:clamp(11px,2.8vmin,13px); letter-spacing:.32em; text-transform:uppercase;
    color:#ffd98a; font-weight:800;
  }
  .btn{
    appearance:none; -webkit-appearance:none; border:0; cursor:pointer; font-family:inherit;
    font-size:clamp(15px,3.6vmin,18px); font-weight:900; letter-spacing:.15em; text-transform:uppercase;
    padding:17px 42px; border-radius:16px; color:#4a1d05; margin-top:4px;
    background:linear-gradient(180deg,#ffdc7a 0%,#ffab48 100%);
    box-shadow:0 5px 0 #c9761f, 0 12px 30px rgba(0,0,0,.34);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:hover{ background:linear-gradient(180deg,#ffe79c 0%,#ffb85e 100%); }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #c9761f, 0 6px 16px rgba(0,0,0,.34); }
  .btn.ghost{
    background:transparent; color:#cfe2ff; padding:12px 26px; font-size:13px; letter-spacing:.18em;
    box-shadow:0 0 0 1px rgba(190,215,255,.4) inset;
  }
  .btn.ghost:hover{ background:rgba(255,255,255,.08); }
  .btn.ghost:active{ transform:translateY(2px); box-shadow:0 0 0 1px rgba(190,215,255,.4) inset; }
  .hint{
    margin:6px 0 0; font-size:clamp(11px,2.7vmin,13px); line-height:1.75; color:#a8c2e8;
    letter-spacing:.05em; max-width:34ch;
  }
  .hint b{ color:#fff; font-weight:800; }

  .scorecard{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .stat{
    min-width:126px; padding:14px 20px; border-radius:18px;
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.22);
  }
  .stat .k{ font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:#a8c2e8; font-weight:800; }
  .stat .v{ font-size:clamp(28px,7.4vmin,40px); font-weight:900; color:#fff; line-height:1.15; }
  .stat.best .v{ color:#ffd166; }
  .headline{
    margin:0; font-size:clamp(26px,7.6vmin,44px); font-weight:900; letter-spacing:.04em; text-transform:uppercase;
    color:#fff; text-shadow:0 3px 0 rgba(255,110,110,.85), 0 10px 26px rgba(0,0,0,.4);
  }
  .record{
    margin:0; font-size:12px; font-weight:900; letter-spacing:.28em; text-transform:uppercase; color:#ffd166;
  }
  .runstats{
    margin:0; font-size:12px; letter-spacing:.13em; color:#a8c2e8; text-transform:uppercase;
    font-weight:800; line-height:1.9; max-width:30ch; text-wrap:balance;
  }

  :focus-visible{ outline:3px solid #ffd166; outline-offset:3px; }

  .tiers{ display:flex; gap:8px; justify-content:center; margin:2px 0 0; width:100%; max-width:430px; }
  .tier{
    appearance:none; -webkit-appearance:none; cursor:pointer; font-family:inherit;
    border:1px solid rgba(255,255,255,.24); background:rgba(255,255,255,.09); color:#b9d0ef;
    padding:11px 9px; border-radius:14px; flex:1 1 0; min-width:0;
    display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center;
    transition:border-color .14s ease, background .14s ease, transform .12s ease, color .14s ease;
  }
  .tier:hover{ background:rgba(255,255,255,.16); }
  .tier:active{ transform:scale(.97); }
  .tier .tn{ font-size:12px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
  .tier .tb{ font-size:10px; letter-spacing:.02em; line-height:1.3; color:#8faaca; }
  .tier[aria-checked="true"]{
    border-color:#ffd166; background:rgba(255,209,102,.18); color:#fff;
    box-shadow:0 0 20px rgba(255,209,102,.28);
  }
  .tier[aria-checked="true"] .tb{ color:#ffd98a; }

  .suggest{
    display:flex; flex-direction:column; gap:9px; align-items:center; margin:0;
    padding:13px 18px; border-radius:16px;
    background:rgba(255,209,102,.12); border:1px solid rgba(255,209,102,.45);
  }
  .suggest .msg{ margin:0; font-size:12px; letter-spacing:.07em; color:#ffd98a; font-weight:800; max-width:31ch; }
  .suggest .btn.ghost{ margin:0; color:#ffe9b8; box-shadow:0 0 0 1px rgba(255,209,102,.5) inset; }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="sysbar">
    <button class="sysbtn" id="btnSound" type="button" aria-label="Toggle sound"></button>
    <button class="sysbtn" id="btnPause" type="button" aria-label="Pause"></button>
  </div>

  <div class="overlay" id="ovMenu">
    <h1 class="logo">Tower<br>Tilt</h1>
    <p class="tagline">Keep it over the base</p>
    <div class="tiers" id="tierPick" role="radiogroup" aria-label="Difficulty"></div>
    <button class="btn" id="btnPlay" type="button">Build</button>
    <p class="hint" id="menuHint"></p>
  </div>

  <div class="overlay" id="ovOver" hidden>
    <h2 class="headline" id="overTitle">Collapsed</h2>
    <p class="record" id="newRecord" hidden>New Record</p>
    <div class="scorecard">
      <div class="stat"><div class="k">Score</div><div class="v" id="finalScore">0</div></div>
      <div class="stat best"><div class="k" id="bestLabel">Best</div><div class="v" id="bestScore">0</div></div>
    </div>
    <p class="runstats" id="runStats"></p>
    <div class="suggest" id="suggestBox" hidden>
      <p class="msg" id="suggestMsg"></p>
      <button class="btn ghost" id="btnSuggest" type="button"></button>
    </div>
    <button class="btn" id="btnAgain" type="button">Build Again</button>
    <button class="btn ghost" id="btnMenu" type="button">Menu</button>
  </div>

  <div class="overlay" id="ovPause" hidden>
    <h2 class="headline">Paused</h2>
    <button class="btn" id="btnResume" type="button">Resume</button>
    <button class="btn ghost" id="btnQuit" type="button">End Run</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================================
     1. PLATFORM BRIDGE — YouTube Playables SDK with safe fallbacks.
     ========================================================================= */
  var YT = (typeof window !== 'undefined' && window.ytgame) ? window.ytgame : null;

  var Platform = {
    audioAllowed: true,
    _firstFrameSent: false,
    _readySent: false,

    init: function (onPause, onResume, onAudioChange) {
      if (!YT) return;
      try { if (YT.system && YT.system.onPause) YT.system.onPause(onPause); } catch (e) {}
      try { if (YT.system && YT.system.onResume) YT.system.onResume(onResume); } catch (e) {}
      try {
        if (YT.system && typeof YT.system.isAudioEnabled === 'function') {
          this.audioAllowed = !!YT.system.isAudioEnabled();
        }
        if (YT.system && YT.system.onAudioEnabledChange) {
          YT.system.onAudioEnabledChange(function (on) {
            Platform.audioAllowed = !!on;
            onAudioChange();
          });
        }
      } catch (e) {}
    },

    firstFrame: function () {
      if (this._firstFrameSent) return;
      this._firstFrameSent = true;
      try { if (YT && YT.game && YT.game.firstFrameReady) YT.game.firstFrameReady(); } catch (e) {}
    },

    ready: function () {
      if (this._readySent) return;
      this._readySent = true;
      try { if (YT && YT.game && YT.game.gameReady) YT.game.gameReady(); } catch (e) {}
    }
  };

  /* =========================================================================
     2. STORAGE — Playables save data first, localStorage fallback.
     ========================================================================= */
  var SAVE_KEY = 'towertilt.v1';

  var Store = {
    data: {
      bests: { cruise: 0, drive: 0, redline: 0 },
      tallest: { cruise: 0, drive: 0, redline: 0 },
      tier: 'drive',
      runs: 0,
      muted: false,
      quickDeaths: 0,
      offeredDown: false,
      offeredUp: false
    },

    best: function (id) { return Store.data.bests[id || Store.data.tier] || 0; },
    tall: function (id) { return Store.data.tallest[id || Store.data.tier] || 0; },

    load: function (done) {
      var IDS = ['cruise', 'drive', 'redline'];
      var finish = function (obj) {
        if (obj && typeof obj === 'object') {
          if (obj.bests && typeof obj.bests === 'object') {
            IDS.forEach(function (k) {
              if (typeof obj.bests[k] === 'number') Store.data.bests[k] = obj.bests[k];
            });
          }
          if (obj.tallest && typeof obj.tallest === 'object') {
            IDS.forEach(function (k) {
              if (typeof obj.tallest[k] === 'number') Store.data.tallest[k] = obj.tallest[k];
            });
          }
          if (typeof obj.tier === 'string' && tierById(obj.tier).id === obj.tier) Store.data.tier = obj.tier;
          if (typeof obj.runs === 'number') Store.data.runs = obj.runs;
          if (typeof obj.muted === 'boolean') Store.data.muted = obj.muted;
          if (typeof obj.quickDeaths === 'number') Store.data.quickDeaths = obj.quickDeaths;
          if (typeof obj.offeredDown === 'boolean') Store.data.offeredDown = obj.offeredDown;
          if (typeof obj.offeredUp === 'boolean') Store.data.offeredUp = obj.offeredUp;
        }
        done();
      };
      if (YT && YT.game && YT.game.loadData) {
        var settled = false;
        var timer = setTimeout(function () { if (!settled) { settled = true; finish(null); } }, 2500);
        try {
          YT.game.loadData().then(function (raw) {
            if (settled) return; settled = true; clearTimeout(timer);
            var o = null; try { o = JSON.parse(raw || '{}'); } catch (e) {}
            finish(o);
          })['catch'](function () {
            if (settled) return; settled = true; clearTimeout(timer); finish(null);
          });
          return;
        } catch (e) { if (!settled) { settled = true; clearTimeout(timer); } }
      }
      var local = null;
      try { local = JSON.parse(window.localStorage.getItem(SAVE_KEY) || '{}'); } catch (e) {}
      finish(local);
    },

    save: function () {
      var raw = JSON.stringify(Store.data);
      if (YT && YT.game && YT.game.saveData) {
        try { YT.game.saveData(raw)['catch'](function () {}); return; } catch (e) {}
      }
      try { window.localStorage.setItem(SAVE_KEY, raw); } catch (e) {}
    }
  };

  /* =========================================================================
     3. AUDIO — procedural. Woody percussive placements, bell flushes, wind.
     No files, no copyright exposure.
     ========================================================================= */
  var Sound = {
    ctx: null, master: null, windGain: null, windFilter: null,
    musicGain: null, noiseBuf: null, started: false, muted: false,
    nextNote: 0, step: 0,

    boot: function () {
      if (this.ctx) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      var ctx = this.ctx;

      this.master = ctx.createGain();
      this.master.gain.value = 0;
      this.master.connect(ctx.destination);

      var len = Math.floor(ctx.sampleRate * 1.5);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var ch = buf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;

      // wind bed — bandpassed noise, opened up by altitude and gusts
      var wsrc = ctx.createBufferSource(); wsrc.buffer = buf; wsrc.loop = true;
      var wbp = ctx.createBiquadFilter(); wbp.type = 'bandpass';
      wbp.frequency.value = 520; wbp.Q.value = 0.6;
      var wg = ctx.createGain(); wg.gain.value = 0;
      wsrc.connect(wbp); wbp.connect(wg); wg.connect(this.master); wsrc.start();
      this.windGain = wg; this.windFilter = wbp;

      var mg = ctx.createGain(); mg.gain.value = 0.42; mg.connect(this.master);
      this.musicGain = mg;

      this.started = true;
      this.applyVolume();
    },

    resumeCtx: function () {
      if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
    },

    applyVolume: function () {
      if (!this.master) return;
      var on = !this.muted && Platform.audioAllowed;
      try { this.master.gain.setTargetAtTime(on ? 0.85 : 0.0, this.ctx.currentTime, 0.02); } catch (e) {}
    },

    hardStop: function () {
      if (!this.master) return;
      try { this.master.gain.setValueAtTime(0, this.ctx.currentTime); } catch (e) {}
    },

    wind: function (amount, active) {
      if (!this.started) return;
      var t = this.ctx.currentTime;
      try {
        this.windGain.gain.setTargetAtTime(active ? 0.02 + amount * 0.10 : 0, t, 0.4);
        this.windFilter.frequency.setTargetAtTime(420 + amount * 900, t, 0.5);
      } catch (e) {}
    },

    blip: function (freq, dur, type, vol) {
      if (!this.started) return null;
      var ctx = this.ctx, t = ctx.currentTime;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol == null ? 0.25 : vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
      return o;
    },

    // A block landing: short woody knock, pitched up a little by the combo.
    place: function (combo) {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      var f = 150 * Math.pow(1.045, Math.min(combo, 12));
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f * 2.2, t);
      o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
      g.gain.setValueAtTime(0.34, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.2);

      var s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
      var bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
      bp.frequency.value = 1500; bp.Q.value = 1.1;
      var ng = ctx.createGain();
      ng.gain.setValueAtTime(0.14, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      s.connect(bp); bp.connect(ng); ng.connect(this.master); s.start(t); s.stop(t + 0.12);
    },

    // A flush: bright struck bell, a third stacked on top.
    flush: function (combo) {
      if (!this.started) return;
      var base = 784 * Math.pow(1.0595, Math.min(combo * 2, 14));
      this.blip(base, 0.5, 'sine', 0.24);
      this.blip(base * 1.5, 0.42, 'sine', 0.13);
      this.blip(base * 2.0, 0.3, 'triangle', 0.07);
    },

    lifeUp: function () {
      this.blip(523, 0.24, 'sine', 0.24);
      this.blip(659, 0.28, 'sine', 0.2);
      this.blip(784, 0.34, 'triangle', 0.16);
    },

    // A block sliding off: wooden clatter tumbling downward.
    miss: function () {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      for (var i = 0; i < 4; i++) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        var st = t + i * 0.055;
        o.type = 'triangle';
        o.frequency.setValueAtTime(300 - i * 48, st);
        g.gain.setValueAtTime(0.0001, st);
        g.gain.linearRampToValueAtTime(0.2 - i * 0.035, st + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.12);
        o.connect(g); g.connect(this.master); o.start(st); o.stop(st + 0.15);
      }
    },

    // The top shearing off: rumble plus a run of clatters.
    shear: function () {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      var s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
      var f = ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(900, t);
      f.frequency.exponentialRampToValueAtTime(140, t + 0.6);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.34, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + 0.72);
      this.miss();
    },

    collapse: function () {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      var s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
      var f = ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(1800, t);
      f.frequency.exponentialRampToValueAtTime(90, t + 1.1);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.55, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + 1.25);
      var o = ctx.createOscillator(), og = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(120, t);
      o.frequency.exponentialRampToValueAtTime(30, t + 0.9);
      og.gain.setValueAtTime(0.45, t);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
      o.connect(og); og.connect(this.master); o.start(t); o.stop(t + 1.05);
    },

    ui: function () { this.blip(660, 0.08, 'triangle', 0.14); },

    /* Ambient pad. Thins out and rises as you climb, so altitude is audible
       as well as visible. Entirely generated — no sampled music. */
    music: function (alt01, active) {
      if (!this.started || !active) { this.nextNote = 0; return; }
      var ctx = this.ctx;
      var spb = 0.62;
      var now = ctx.currentTime;
      if (this.nextNote === 0) this.nextNote = now + 0.05;
      var LOW = [130.81, 146.83, 174.61, 196.00];
      var HI = [523.25, 587.33, 659.25, 783.99, 880.00];
      var guard = 0;
      while (this.nextNote < now + 0.25 && guard++ < 16) {
        var t = this.nextNote;
        if (this.step % 4 === 0) {
          var lo = ctx.createOscillator(), lg = ctx.createGain();
          lo.type = 'sine';
          lo.frequency.setValueAtTime(LOW[Math.floor(this.step / 4) % LOW.length], t);
          lg.gain.setValueAtTime(0.0001, t);
          lg.gain.linearRampToValueAtTime(0.16 * (1 - alt01 * 0.55), t + 0.35);
          lg.gain.exponentialRampToValueAtTime(0.0001, t + spb * 4);
          lo.connect(lg); lg.connect(this.musicGain);
          lo.start(t); lo.stop(t + spb * 4.1);
        }
        if (this.step % 2 === 0) {
          var hi = ctx.createOscillator(), hg = ctx.createGain();
          hi.type = 'triangle';
          hi.frequency.setValueAtTime(HI[(this.step * 3) % HI.length], t);
          hg.gain.setValueAtTime(0.0001, t);
          hg.gain.linearRampToValueAtTime(0.03 + alt01 * 0.045, t + 0.05);
          hg.gain.exponentialRampToValueAtTime(0.0001, t + spb * 1.6);
          hi.connect(hg); hg.connect(this.musicGain);
          hi.start(t); hi.stop(t + spb * 1.7);
        }
        this.step++;
        this.nextNote += spb;
      }
    }
  };

  /* =========================================================================
     4. CONSTANTS + TIERS
     ========================================================================= */
  var LOGICAL_H = 960;
  /* Block and sweep are fixed logical sizes, not fractions of the viewport, so
     the game plays identically on a 9:20 phone and a 16:9 desktop. They are
     sized for the narrowest screen we support: on a 9:20 phone the visible
     logical width is ~432, so the widest the crane can swing while keeping the
     whole block on screen is (432/2) - (BLOCK_W/2) - margin. Letting the sweep
     scale with the viewport instead would both change the difficulty per device
     and hang the block off the edge of a phone, where you cannot aim at it. */
  var BLOCK_W = 126;
  var BLOCK_H = 40;
  var SWEEP_AMP = 145;
  var BASE_HALF = 100;          // half-width of the foundation the load must stay over
  var GROUND_FRAC = 0.86;       // where the foundation sits on screen
  var TOP_FRAC = 0.44;          // where the camera holds the top of the tower
  var LEAN_MAX_ANGLE = 0.15;    // radians of visible tilt at the tipping point
  var FALL_G = 4600;
  var GRACE_TIME = 1.2;         // input lock + safety after a shear
  var REINFORCED_EVERY = 13;

  /* Difficulty. For a timing game the equivalent of a reaction window is how
     long the carriage spends inside the landing zone on each pass. The
     carriage swings sinusoidally, so it is fastest at the centre; these
     numbers are the worst case, measured at that peak speed:

                    land window        flush window
        Cruise      ~0.76s             ~0.14s
        Drive       ~0.50s             ~0.08s
        Redline     ~0.34s             ~0.04s

     As in Neon Drift, nothing about the *control* changes between tiers —
     one tap, same response. Only the world gets harder. */
  var TIERS = [
    {
      id: 'cruise', name: 'Cruise', blurb: 'Room to aim',
      sweep0: 330, sweepMax: 520, sweepRamp: 0.085,
      flushFrac: 0.14, missFrac: 0.25, tolMul: 1.25, tolDecay: 0.007,
      windFrom: 20, windMax: 26, windPeriod: [9, 14],
      lives: 4, maxLives: 6, shearBlocks: 3, scoreMul: 0.7
    },
    {
      id: 'drive', name: 'Drive', blurb: 'The real thing',
      sweep0: 470, sweepMax: 760, sweepRamp: 0.12,
      flushFrac: 0.11, missFrac: 0.30, tolMul: 1.0, tolDecay: 0.010,
      windFrom: 12, windMax: 40, windPeriod: [7, 11],
      lives: 3, maxLives: 5, shearBlocks: 4, scoreMul: 1.0
    },
    {
      id: 'redline', name: 'Redline', blurb: 'Steady hands',
      sweep0: 640, sweepMax: 1040, sweepRamp: 0.16,
      flushFrac: 0.08, missFrac: 0.35, tolMul: 0.82, tolDecay: 0.013,
      windFrom: 6, windMax: 56, windPeriod: [5, 9],
      lives: 2, maxLives: 3, shearBlocks: 5, scoreMul: 1.45
    }
  ];

  function tierById(id) {
    for (var i = 0; i < TIERS.length; i++) if (TIERS[i].id === id) return TIERS[i];
    return TIERS[1];
  }
  function tierIndex(id) {
    for (var i = 0; i < TIERS.length; i++) if (TIERS[i].id === id) return i;
    return 1;
  }

  var BLOCK_COLORS = [
    ['#ff8f6b', '#e0522f'], ['#ffc861', '#dd9218'], ['#6fe3b8', '#1ca67c'],
    ['#6cc6ff', '#2073c4'], ['#c49bff', '#7a45d6'], ['#ff8fb8', '#d63f78']
  ];
  var GOLD = ['#ffe07a', '#d99a12'];

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fmt(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function mixHex(a, b, t) {
    var ar = parseInt(a.slice(1, 3), 16), ag = parseInt(a.slice(3, 5), 16), ab = parseInt(a.slice(5, 7), 16);
    var br = parseInt(b.slice(1, 3), 16), bg = parseInt(b.slice(3, 5), 16), bb = parseInt(b.slice(5, 7), 16);
    return 'rgb(' + Math.round(lerp(ar, br, t)) + ',' + Math.round(lerp(ag, bg, t)) + ',' +
      Math.round(lerp(ab, bb, t)) + ')';
  }

  /* =========================================================================
     5. VIEW / CANVAS SCALING, SPRITE + GRADIENT CACHE
     ========================================================================= */
  var app = document.getElementById('app');
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });

  var view = { w: 540, h: LOGICAL_H, scale: 1, dpr: 1 };
  var sprites = {};
  var spriteQ = 2;
  var hudScrim = null;

  function sprite(key, w, h, paint) {
    var k = key + '|' + Math.round(w) + 'x' + Math.round(h) + '@' + spriteQ;
    var hit = sprites[k];
    if (hit) return hit;
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.ceil(w * spriteQ));
    cv.height = Math.max(1, Math.ceil(h * spriteQ));
    var c2 = cv.getContext('2d');
    c2.setTransform(spriteQ, 0, 0, spriteQ, 0, 0);
    paint(c2, w, h);
    hit = { cv: cv, w: w, h: h };
    sprites[k] = hit;
    return hit;
  }

  function blit(s, cx, cy) { ctx.drawImage(s.cv, cx - s.w / 2, cy - s.h / 2, s.w, s.h); }

  function layout() {
    var cw = Math.max(1, app.clientWidth || window.innerWidth);
    var chh = Math.max(1, app.clientHeight || window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    // Render-resolution budget: past ~2.6M device pixels, step density down
    // rather than drop frames. Invisible; holding 60fps is not.
    var budget = 2.6e6;
    var pxCount = cw * chh * dpr * dpr;
    if (pxCount > budget) dpr = Math.max(1, dpr * Math.sqrt(budget / pxCount));

    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(chh * dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = chh + 'px';

    view.dpr = dpr;
    view.scale = chh / LOGICAL_H;
    view.h = LOGICAL_H;
    view.w = cw / view.scale;

    ctx.setTransform(dpr * view.scale, 0, 0, dpr * view.scale, 0, 0);
    spriteQ = clamp(view.scale * view.dpr, 1, 2.5);
    sprites = {};
    skyCache.key = null;
    hudScrim = null;
    seedClouds();
    seedStars();
  }

  function baseX() { return view.w / 2; }
  function groundY() { return view.h * GROUND_FRAC; }

  /* =========================================================================
     6. SKY — the whole palette is a function of altitude, so climbing is
     visible in the background as well as in the numbers.
     ========================================================================= */
  var SKY = [
    { at: 0.00, top: '#4a86d6', mid: '#9fd0f5', low: '#ffd6a4', sun: '#fff0cf' },
    { at: 0.34, top: '#2f6fc9', mid: '#7cc0ef', low: '#d9f0ff', sun: '#ffffff' },
    { at: 0.68, top: '#12306e', mid: '#2d5da8', low: '#7ba7dd', sun: '#dce9ff' },
    { at: 1.00, top: '#03050f', mid: '#0a1130', low: '#1d2a5c', sun: '#c9d6ff' }
  ];

  function skyAt(a) {
    var i = 0;
    while (i < SKY.length - 2 && a > SKY[i + 1].at) i++;
    var s0 = SKY[i], s1 = SKY[i + 1];
    var t = clamp((a - s0.at) / (s1.at - s0.at), 0, 1);
    return {
      top: mixHex(s0.top, s1.top, t),
      mid: mixHex(s0.mid, s1.mid, t),
      low: mixHex(s0.low, s1.low, t),
      sun: mixHex(s0.sun, s1.sun, t)
    };
  }

  var clouds = [], stars = [];

  function seedClouds() {
    clouds = [];
    for (var i = 0; i < 16; i++) {
      clouds.push({
        x: rnd(-140, view.w + 140),
        alt: rnd(0, 4200),                 // world altitude the cloud sits at
        w: rnd(120, 300), h: rnd(26, 52),
        drift: rnd(5, 20) * (Math.random() < 0.5 ? -1 : 1),
        a: rnd(0.5, 0.95)
      });
    }
  }

  function seedStars() {
    stars = [];
    for (var i = 0; i < 90; i++) {
      stars.push({ x: rnd(0, view.w), y: rnd(0, view.h), r: rnd(0.7, 1.9), tw: rnd(0, 6.28) });
    }
  }

  /* =========================================================================
     7. GAME STATE
     ========================================================================= */
  var S = {
    mode: 'menu',           // menu | play | falling | shear | dead | paused
    tier: TIERS[1],
    time: 0,
    score: 0,
    combo: 1,
    bestCombo: 1,
    lives: 3,
    maxLives: 5,
    grace: 0,
    placed: 0,
    flushes: 0,
    misses: 0,
    shears: 0,
    livesGained: 0,
    peak: 0,

    tower: [],              // {x, ci, gold} — x is offset from the base centre
    falling: null,
    debris: [],
    parts: [],
    floats: [],
    toasts: [],
    tipsShown: {},

    camY: 0, camTarget: 0,
    lean: 0, leanShown: 0,
    phase: 0,
    carriageX: 0,
    wind: 0, windTarget: 0, windTimer: 8,
    shake: 0, flashGood: 0, flashBad: 0,
    shearQueue: 0, shearTimer: 0,
    deathT: 0,
    nextGold: REINFORCED_EVERY
  };

  var lastDt = 1 / 60;

  function resetRun() {
    var T = tierById(Store.data.tier);
    S.tier = T;
    S.time = 0; S.score = 0; S.combo = 1; S.bestCombo = 1;
    S.lives = T.lives; S.maxLives = T.maxLives; S.grace = 0;
    S.placed = 0; S.flushes = 0; S.misses = 0; S.shears = 0; S.livesGained = 0; S.peak = 0;
    S.tower = [{ x: 0, ci: 0, gold: false }];
    S.falling = null;
    S.debris.length = 0; S.parts.length = 0; S.floats.length = 0; S.toasts.length = 0;
    S.tipsShown = {};
    S.camY = 0; S.camTarget = 0;
    S.lean = 0; S.leanShown = 0;
    S.phase = 0; S.carriageX = 0;
    S.wind = 0; S.windTarget = 0; S.windTimer = rnd(T.windPeriod[0], T.windPeriod[1]);
    S.shake = 0; S.flashGood = 0; S.flashBad = 0;
    S.shearQueue = 0; S.shearTimer = 0; S.deathT = 0;
    S.nextGold = REINFORCED_EVERY;
  }

  function height() { return S.tower.length; }
  function topBlock() { return S.tower[S.tower.length - 1]; }
  function altitude01() { return clamp(height() / 130, 0, 1); }

  /* Tolerance: how far the loaded centre of mass may sit from the base centre
     before the tower gives. It narrows as you build, which is what makes a
     tall tower genuinely harder rather than just longer. */
  function tolerance() {
    var T = S.tier;
    return BASE_HALF * T.tolMul * (1 - Math.min(0.52, height() * T.tolDecay));
  }

  /* Centre of mass. Blocks higher up count for more — a real tower fails by
     bending, not by rigid tipping, and weighting by height also keeps recent
     placements meaningful instead of being averaged away at height 60. */
  function centreOfMass() {
    var sum = 0, wsum = 0;
    for (var i = 0; i < S.tower.length; i++) {
      var w = Math.min(4, 1 + i * 0.06);
      sum += S.tower[i].x * w;
      wsum += w;
    }
    return wsum ? sum / wsum : 0;
  }

  function recomputeLean() {
    S.lean = (centreOfMass() + S.wind) / tolerance();
  }

  function toast(id, text) {
    if (S.tipsShown[id]) return;
    S.tipsShown[id] = true;
    S.toasts.push({ text: text, life: 2.7, max: 2.7 });
  }

  function floatText(x, y, text, color, size) {
    // Keep the label on screen — a block can miss from well off to one side,
    // and a score popup half off the edge is just noise.
    S.floats.push({
      x: clamp(x, 78, view.w - 78), y: clamp(y, 150, view.h - 90),
      text: text, color: color, life: 1.0, size: size || 26
    });
  }

  function burst(x, y, color, n, spread, speed) {
    for (var i = 0; i < n; i++) {
      var a = rnd(0, Math.PI * 2);
      var s = rnd(speed * 0.3, speed);
      S.parts.push({
        x: x + rnd(-spread, spread), y: y + rnd(-spread, spread),
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
        life: rnd(0.3, 0.8), max: 0.8, size: rnd(2.5, 6.5), color: color
      });
    }
  }

  /* =========================================================================
     8. INPUT — one action, everywhere.
     ========================================================================= */
  function canDrop() {
    return S.mode === 'play' && !S.falling && S.grace <= 0;
  }

  function drop() {
    if (!canDrop()) return;
    var gold = (S.placed + 1) >= S.nextGold;
    S.falling = {
      x: S.carriageX,
      y: carriageLocalY(),
      vy: 0,
      ci: S.tower.length % BLOCK_COLORS.length,
      gold: gold
    };
    Sound.boot(); Sound.resumeCtx();
  }

  canvas.addEventListener('pointerdown', function (e) {
    Sound.boot(); Sound.resumeCtx();
    drop();
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === ' ' || k === 'Enter' || k === 'ArrowDown') {
      if (S.mode === 'play') { drop(); e.preventDefault(); }
      else if (S.mode === 'menu') { startRun(); e.preventDefault(); }
      else if (S.mode === 'dead' && gameOverShown) { startRun(); e.preventDefault(); }
    } else if (k === 'Escape' || k === 'p' || k === 'P') {
      if (S.mode === 'play' || S.mode === 'falling') pauseGame();
      else if (S.mode === 'paused') resumeGame();
    } else if (k === 'm' || k === 'M') { toggleMute(); }
  });

  /* =========================================================================
     9. UPDATE
     ========================================================================= */
  function carriageLocalY() {
    // The carriage rides above the top of the tower, in tower-local space, so
    // it leans with the structure it is mounted on.
    return height() * BLOCK_H + 170;
  }

  function sweepSpeed() {
    var T = S.tier;
    return Math.min(T.sweepMax, T.sweep0 + height() * T.sweepRamp * 20);
  }

  function sweepAmp() {
    // Never wider than the screen can show the block in full.
    return Math.min(SWEEP_AMP, Math.max(70, view.w / 2 - BLOCK_W / 2 - 8));
  }

  function update(dt) {
    if (S.mode === 'paused') return;

    if (S.mode === 'dead') {
      S.deathT += dt;
      updateFx(dt, dt * 0.5);
      updateCamera(dt);
      if (S.deathT > 1.1 && !gameOverShown) showGameOver();
      return;
    }
    if (S.mode === 'menu') { updateFx(dt, dt); updateCamera(dt); return; }

    S.time += dt;
    if (S.grace > 0) S.grace = Math.max(0, S.grace - dt);

    // --- carriage sweep (sinusoidal: slowest at the edges, fastest dead centre,
    //     so the most valuable placement is also the hardest to time)
    var amp = sweepAmp();
    var omega = sweepSpeed() / Math.max(1, amp);
    S.phase += omega * dt;
    S.carriageX = Math.sin(S.phase) * amp;

    // --- wind
    var T = S.tier;
    if (height() >= T.windFrom) {
      S.windTimer -= dt;
      if (S.windTimer <= 0) {
        var mag = rnd(T.windMax * 0.45, T.windMax);
        S.windTarget = mag * (Math.random() < 0.5 ? -1 : 1);
        S.windTimer = rnd(T.windPeriod[0], T.windPeriod[1]);
        toast('wind', 'WIND — BUILD INTO IT');
      }
    }
    S.wind = lerp(S.wind, S.windTarget, Math.min(1, dt * 0.8));

    // --- falling block
    if (S.falling) {
      S.falling.vy -= FALL_G * dt;
      S.falling.y += S.falling.vy * dt;
      var restY = height() * BLOCK_H;
      if (S.falling.y <= restY) {
        S.falling.y = restY;
        land(S.falling);
        S.falling = null;
      }
    }

    // --- shear cascade: the top of the tower comes off one block at a time
    if (S.shearQueue > 0) {
      S.shearTimer -= dt;
      if (S.shearTimer <= 0) {
        shedTopBlock();
        S.shearQueue--;
        S.shearTimer = 0.09;
        if (S.shearQueue === 0) {
          recomputeLean();
          if (Math.abs(S.lean) >= 1 && S.tower.length > 2) {
            S.shearQueue = 2; S.shearTimer = 0.09;   // still over — keep shedding
          }
        }
      }
    }

    recomputeLean();
    S.leanShown = lerp(S.leanShown, clamp(S.lean, -1.35, 1.35), Math.min(1, dt * 7));

    if (Math.abs(S.lean) > 0.55) toast('lean', 'LEANING — STACK THE OTHER WAY');

    updateFx(dt, dt);
    updateCamera(dt);

    var alt = altitude01();
    Sound.wind(clamp(Math.abs(S.wind) / 40 + alt * 0.5, 0, 1), true);
    Sound.music(alt, true);
  }

  function updateCamera(dt) {
    S.camTarget = Math.max(0, height() * BLOCK_H - view.h * (GROUND_FRAC - TOP_FRAC));
    S.camY = lerp(S.camY, S.camTarget, Math.min(1, dt * 6));
  }

  function land(b) {
    var T = S.tier;
    var below = topBlock();
    var dx = b.x - below.x;
    var adx = Math.abs(dx);
    var landLimit = BLOCK_W * (1 - T.missFrac);
    var flushLimit = BLOCK_W * T.flushFrac;

    if (adx > landLimit) { missBlock(b, dx); return; }

    var flush = adx <= flushLimit;
    // A flush landing snaps flat; anything else keeps the offset it earned,
    // which is exactly what shifts the centre of mass.
    S.tower.push({ x: flush ? below.x : b.x, ci: b.ci, gold: b.gold });
    S.placed++;
    if (b.gold) S.nextGold = S.placed + REINFORCED_EVERY;
    S.peak = Math.max(S.peak, height());

    var hy = towerTopScreenY();
    var hx = baseX() + (flush ? below.x : b.x);

    if (flush) {
      S.flushes++;
      S.combo = Math.min(12, S.combo + 1);
      S.bestCombo = Math.max(S.bestCombo, S.combo);
      var pts = Math.round((40 + height()) * S.combo * T.scoreMul);
      S.score += pts;
      S.flashGood = 1;
      floatText(hx, hy - 44, 'FLUSH +' + pts, '#ffe07a', 27);
      burst(hx, hy, '#ffe9a8', 16, BLOCK_W * 0.4, 250);
      Sound.flush(S.combo);
      if (S.combo === 3) toast('combo', 'FLUSH RUNS MULTIPLY YOUR SCORE');

      if (b.gold) {
        if (S.lives < S.maxLives) {
          S.lives++; S.livesGained++;
          floatText(hx, hy - 90, '+1 LIFE', '#8dffc4', 26);
          burst(hx, hy, '#8dffc4', 20, BLOCK_W * 0.4, 300);
        } else {
          var bonus = Math.round(400 * T.scoreMul);
          S.score += bonus;
          floatText(hx, hy - 90, '+' + bonus, '#8dffc4', 24);
        }
        Sound.lifeUp();
      }
    } else {
      S.combo = 1;
      var p2 = Math.round((10 + height() * 0.6) * T.scoreMul);
      S.score += p2;
      Sound.place(1);
      if (b.gold) floatText(hx, hy - 44, 'NOT FLUSH', '#ffd9a4', 20);
      if (S.placed === 3) toast('flush', 'LAND ONE DEAD CENTRE FOR A FLUSH');
    }

    S.shake = Math.max(S.shake, flush ? 3 : 5 + adx * 0.03);
    burst(hx, hy, '#ffffff', flush ? 6 : 10, BLOCK_W * 0.35, 160);

    recomputeLean();
    if (Math.abs(S.lean) >= 1) teeter();

    if (!b.gold && S.placed + 1 >= S.nextGold) {
      toast('gold', 'GOLD BLOCK NEXT — FLUSH IT FOR A LIFE');
    }
  }

  function missBlock(b, dx) {
    S.misses++;
    S.combo = 1;
    S.lives--;
    S.flashBad = 1;
    S.shake = Math.max(S.shake, 14);
    var hx = baseX() + b.x;
    var hy = towerTopScreenY();
    S.debris.push({
      x: b.x, y: b.y, vx: dx > 0 ? rnd(60, 150) : rnd(-150, -60), vy: 40,
      rot: 0, vr: (dx > 0 ? 1 : -1) * rnd(3, 6), ci: b.ci, gold: b.gold
    });
    floatText(hx, hy - 40, 'MISSED', '#ff8a8a', 26);
    Sound.miss();
    if (S.lives <= 0) { S.lives = 0; collapse('Toppled'); return; }
    S.grace = GRACE_TIME * 0.5;
    if (S.lives === 1) toast('lastlife', 'LAST LIFE — PLAY IT SAFE');
  }

  /* The load has gone past the base. Rather than ending the run, the tower
     sheds its top few blocks — which is both what a real overloaded stack does
     and what actually fixes the problem, since the highest blocks carry the
     most leverage. It costs a life and a lot of height, so it stings without
     being the end. */
  function teeter() {
    if (S.tower.length <= 2) { collapse('Toppled'); return; }
    S.lives--;
    S.shears++;
    S.combo = 1;
    S.flashBad = 1;
    S.shake = Math.max(S.shake, 22);
    if (S.lives <= 0) { S.lives = 0; collapse('Toppled'); return; }

    S.shearQueue = S.tier.shearBlocks;
    S.shearTimer = 0;
    S.grace = GRACE_TIME;
    floatText(baseX(), towerTopScreenY() - 60, 'TOP SHEARED', '#ff8a8a', 27);
    toast('shear', 'OVERLOADED — THE TOP CAME OFF');
    Sound.shear();
  }

  function shedTopBlock() {
    if (S.tower.length <= 1) return;
    var b = S.tower.pop();
    var dir = S.lean >= 0 ? 1 : -1;
    S.debris.push({
      x: b.x, y: S.tower.length * BLOCK_H, vx: dir * rnd(70, 180), vy: rnd(40, 140),
      rot: 0, vr: dir * rnd(2.5, 6), ci: b.ci, gold: b.gold
    });
    burst(baseX() + b.x, towerTopScreenY(), '#ffffff', 8, 40, 200);
  }

  function collapse(title) {
    if (S.mode === 'dead') return;
    S.mode = 'dead';
    S.deathT = 0;
    S.shake = 30;
    S.flashBad = 1;
    overTitleText = title;
    // the whole stack comes down
    var dir = S.lean >= 0 ? 1 : -1;
    for (var i = S.tower.length - 1; i >= 1; i--) {
      var b = S.tower[i];
      S.debris.push({
        x: b.x, y: i * BLOCK_H,
        vx: dir * rnd(40, 260) * (0.4 + i / Math.max(1, S.tower.length)),
        vy: rnd(-40, 190),
        rot: 0, vr: dir * rnd(1.5, 7), ci: b.ci, gold: b.gold
      });
    }
    S.tower.length = 1;
    Sound.collapse();
    Sound.wind(0, false);
    Sound.music(0, false);
  }

  function updateFx(dt, sdt) {
    S.shake = Math.max(0, S.shake - dt * 34);
    S.flashGood = Math.max(0, S.flashGood - dt * 2.6);
    S.flashBad = Math.max(0, S.flashBad - dt * 2.2);

    for (var d = S.debris.length - 1; d >= 0; d--) {
      var b = S.debris[d];
      b.vy -= FALL_G * 0.45 * sdt;
      b.x += b.vx * sdt;
      b.y += b.vy * sdt;
      b.rot += b.vr * sdt;
      if (b.y < S.camY - view.h * 1.4) S.debris.splice(d, 1);
    }
    for (var i = S.parts.length - 1; i >= 0; i--) {
      var p = S.parts[i];
      p.life -= sdt;
      if (p.life <= 0) { S.parts.splice(i, 1); continue; }
      p.x += p.vx * sdt; p.y += p.vy * sdt; p.vy += 620 * sdt;
    }
    for (var j = S.floats.length - 1; j >= 0; j--) {
      var f = S.floats[j];
      f.life -= dt; f.y -= 46 * dt;
      if (f.life <= 0) S.floats.splice(j, 1);
    }
    for (var k = S.toasts.length - 1; k >= 0; k--) {
      S.toasts[k].life -= dt;
      if (S.toasts[k].life <= 0) S.toasts.splice(k, 1);
    }
    for (var c = 0; c < clouds.length; c++) {
      clouds[c].x += clouds[c].drift * dt;
      if (clouds[c].x > view.w + 200) clouds[c].x = -200;
      if (clouds[c].x < -200) clouds[c].x = view.w + 200;
    }
  }

  /* =========================================================================
     10. RENDER
     ========================================================================= */
  function pivotScreenY() { return groundY() + S.camY; }
  function towerTopScreenY() { return pivotScreenY() - height() * BLOCK_H; }
  function leanAngle() { return LEAN_MAX_ANGLE * clamp(S.leanShown, -1.2, 1.2); }

  function render() {
    var W = view.w, H = view.h;
    drawSky(W, H);

    ctx.save();
    if (S.shake > 0.2) ctx.translate(rnd(-S.shake, S.shake) * 0.4, rnd(-S.shake, S.shake) * 0.4);

    drawGround(W, H);

    // Everything structural lives in tower space: the stack, the carriage that
    // is mounted on it, and the block currently in the air. Rotating once here
    // is what makes the lean read at a glance.
    ctx.save();
    ctx.translate(baseX(), pivotScreenY());
    ctx.rotate(leanAngle());
    drawFoundation();
    drawMast();
    drawTower();
    if (S.mode !== 'dead' && S.mode !== 'menu') drawCarriage();
    if (S.falling) drawFallingBlock();
    ctx.restore();

    drawDebris();
    drawParticles();
    ctx.restore();

    drawHud(W, H);

    if (S.flashGood > 0.01) {
      ctx.fillStyle = 'rgba(255,240,190,' + (S.flashGood * 0.20) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (S.flashBad > 0.01) {
      ctx.save();
      ctx.globalAlpha = S.flashBad * 0.8;
      var g = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.2, W / 2, H * 0.55, Math.max(W, H) * 0.75);
      g.addColorStop(0, 'rgba(255,60,60,0)');
      g.addColorStop(1, 'rgba(255,60,60,0.6)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  /* Full-screen gradients are the single most expensive thing in this scene and
     the sky only changes with altitude, so they are rebuilt when the altitude
     bucket moves rather than once per frame. Same lesson as Neon Drift: this is
     the difference between 30 and 60fps on a desktop window. */
  var skyCache = { key: null, cv: null, ground: null };
  var SKY_TEX_W = 192, SKY_TEX_H = 448;

  /* The sky is a smooth gradient plus a soft sun, so it is painted ONCE into a
     small offscreen texture and stretched over the screen. A blit of a stretched
     image is far cheaper than two full-screen gradient fills per frame — and one
     of those was radial, which is the most expensive fill there is. Rebuilt only
     when the altitude bucket moves. */
  function skyTexture(a) {
    var key = Math.round(a * 48);
    if (skyCache.key === key && skyCache.cv) return skyCache;
    var s = skyAt(a);

    if (!skyCache.cv) {
      skyCache.cv = document.createElement('canvas');
      skyCache.cv.width = SKY_TEX_W;
      skyCache.cv.height = SKY_TEX_H;
    }
    var c = skyCache.cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);

    var g = c.createLinearGradient(0, 0, 0, SKY_TEX_H);
    g.addColorStop(0, s.top);
    g.addColorStop(0.55, s.mid);
    g.addColorStop(1, s.low);
    c.fillStyle = g;
    c.fillRect(0, 0, SKY_TEX_W, SKY_TEX_H);

    var sunY = SKY_TEX_H * (0.26 + a * 0.5);
    var sg = c.createRadialGradient(SKY_TEX_W * 0.72, sunY, 3, SKY_TEX_W * 0.72, sunY, SKY_TEX_H * 0.45);
    sg.addColorStop(0, 'rgba(255,246,214,' + Math.max(0, 0.55 - a * 0.42) + ')');
    sg.addColorStop(1, 'rgba(255,246,214,0)');
    c.fillStyle = sg;
    c.fillRect(0, 0, SKY_TEX_W, SKY_TEX_H);

    skyCache.ground = ctx.createLinearGradient(0, 0, 0, 200);
    skyCache.ground.addColorStop(0, mixHex('#3d6b3a', '#101c3a', a));
    skyCache.ground.addColorStop(1, mixHex('#24421f', '#070c1c', a));

    skyCache.key = key;
    return skyCache;
  }

  function drawSky(W, H) {
    var a = altitude01();
    var tex = skyTexture(a);
    ctx.drawImage(tex.cv, 0, 0, SKY_TEX_W, SKY_TEX_H, 0, 0, W, H);

    // stars fade in with altitude — one alpha for the whole layer keeps the
    // state changes down; the twinkle rides on the layer instead of each star
    if (a > 0.4) {
      ctx.save();
      ctx.globalAlpha = ((a - 0.4) / 0.6) * (0.7 + 0.3 * ((Math.sin(S.time * 1.2) + 1) / 2));
      ctx.fillStyle = '#ffffff';
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i];
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.2832); ctx.fill();
      }
      ctx.restore();
    }

    drawClouds(W, H, a);
  }

  function drawClouds(W, H, a) {
    var cloud = sprite('cloud', 320, 90, function (c, w, h) {
      c.fillStyle = '#ffffff';
      c.beginPath();
      c.ellipse(w * 0.34, h * 0.62, w * 0.26, h * 0.28, 0, 0, 6.2832);
      c.ellipse(w * 0.52, h * 0.48, w * 0.22, h * 0.34, 0, 0, 6.2832);
      c.ellipse(w * 0.68, h * 0.63, w * 0.20, h * 0.24, 0, 0, 6.2832);
      c.fill();
    });
    ctx.save();
    for (var i = 0; i < clouds.length; i++) {
      var cl = clouds[i];
      var sy = groundY() + S.camY - cl.alt;
      if (sy < -120 || sy > H + 120) continue;
      var k = cl.w / 320;
      ctx.globalAlpha = cl.a * (1 - a * 0.65);
      ctx.drawImage(cloud.cv, cl.x - cl.w / 2, sy - (90 * k) / 2, cl.w, 90 * k);
    }
    ctx.restore();
  }

  function drawGround(W, H) {
    var gy = groundY() + S.camY;
    if (gy > H + 260) return;
    var a = altitude01();

    // distant skyline sitting on the horizon, dimming as you rise above it
    ctx.save();
    ctx.globalAlpha = 0.5 - a * 0.4;
    ctx.fillStyle = '#2a3f74';
    var seedX = 0;
    for (var i = 0; i < 26; i++) {
      var bw = 26 + ((i * 37) % 44);
      var bh = 40 + ((i * 71) % 130);
      ctx.fillRect(seedX, gy - bh, bw, bh + 40);
      seedX += bw + 12 + ((i * 13) % 18);
      if (seedX > W + 60) break;
    }
    ctx.restore();

    ctx.save();
    ctx.translate(0, gy);
    ctx.fillStyle = skyCache.ground || '#24421f';
    ctx.fillRect(0, 0, W, H - gy + 260);
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fillRect(0, gy, W, 3);
  }

  function blockSprite(ci, gold) {
    var key = gold ? 'blkGold' : ('blk' + ci);
    var col = gold ? GOLD : BLOCK_COLORS[ci % BLOCK_COLORS.length];
    return sprite(key, BLOCK_W + 12, BLOCK_H + 12, function (c, SW, SH) {
      var x = 6, y = 6, w = BLOCK_W, h = BLOCK_H;
      c.fillStyle = 'rgba(0,0,0,0.16)';
      roundRect(c, x, y + 4, w, h, 9); c.fill();

      var g = c.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, col[0]);
      g.addColorStop(1, col[1]);
      c.fillStyle = g;
      roundRect(c, x, y, w, h, 9); c.fill();

      // top facet + inner edge, so a stack of them reads as solid objects
      c.fillStyle = 'rgba(255,255,255,0.42)';
      roundRect(c, x + 5, y + 4, w - 10, h * 0.24, 5); c.fill();
      c.strokeStyle = 'rgba(0,0,0,0.16)';
      c.lineWidth = 1.5;
      roundRect(c, x + 0.75, y + 0.75, w - 1.5, h - 1.5, 9); c.stroke();

      if (gold) {
        c.fillStyle = 'rgba(120,70,0,0.45)';
        for (var i = 0; i < 5; i++) {
          c.beginPath();
          c.arc(x + w * (0.14 + i * 0.18), y + h * 0.72, 3.2, 0, 6.2832);
          c.fill();
        }
      }
    });
  }

  function drawFoundation() {
    var w = BASE_HALF * 2 + 34, h = 46;
    var s = sprite('foundation', w + 14, h + 14, function (c, SW, SH) {
      var x = 7, y = 7;
      var g = c.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, '#9aa6bf');
      g.addColorStop(1, '#5c6880');
      c.fillStyle = g;
      roundRect(c, x, y, w, h, 8); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.35)';
      roundRect(c, x + 6, y + 4, w - 12, 9, 4); c.fill();
      // hatching so the base reads as fixed ground, not another block
      c.strokeStyle = 'rgba(30,40,60,0.30)';
      c.lineWidth = 2;
      for (var i = -h; i < w; i += 16) {
        c.beginPath(); c.moveTo(x + i, y + h); c.lineTo(x + i + h, y); c.stroke();
      }
    });
    blit(s, 0, h / 2);

    // tolerance markers: exactly how far the load may sit from centre
    var tol = tolerance();
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = Math.abs(S.lean) > 0.7 ? '#ff6b6b' : '#ffffff';
    ctx.lineWidth = 3;
    ctx.setLineDash([5, 6]);
    ctx.beginPath();
    ctx.moveTo(-tol, 4); ctx.lineTo(-tol, -16);
    ctx.moveTo(tol, 4); ctx.lineTo(tol, -16);
    ctx.stroke();
    ctx.restore();
  }

  function drawTower() {
    var first = Math.max(0, Math.floor((S.camY - BLOCK_H * 2) / BLOCK_H));
    var last = Math.min(S.tower.length - 1, Math.ceil((S.camY + view.h) / BLOCK_H) + 1);
    for (var i = first; i <= last; i++) {
      var b = S.tower[i];
      blit(blockSprite(b.ci, b.gold), b.x, -(i * BLOCK_H + BLOCK_H / 2));
    }

    // centre-of-mass plumb line — the thing you are actually managing
    if (S.mode !== 'menu' && S.tower.length > 2) {
      var com = centreOfMass() + S.wind;
      var topY = -(S.tower.length * BLOCK_H);
      // Amber and solid, so it never reads as the same thing as the white
      // dashed drop guide hanging off the crane.
      ctx.save();
      ctx.globalAlpha = 0.55 + Math.min(0.4, Math.abs(S.lean) * 0.4);
      ctx.strokeStyle = Math.abs(S.lean) > 0.7 ? '#ff5a5a' : '#ffd166';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(com, topY); ctx.lineTo(com, 0); ctx.stroke();
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath(); ctx.arc(com, topY, 4.5, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }

  // The mast is a full-height column standing on the foundation, drawn behind
  // the stack. Rooting it at the top block instead leaves it hanging in mid-air
  // the moment the tower walks sideways.
  function drawMast() {
    if (S.mode === 'dead' || S.mode === 'menu') return;
    ctx.save();
    ctx.strokeStyle = 'rgba(40,54,84,0.38)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, -carriageLocalY());
    ctx.stroke();
    ctx.restore();
  }

  function drawCarriage() {
    var y = -carriageLocalY();
    var topY = -(height() * BLOCK_H);

    var amp = sweepAmp();
    ctx.save();
    ctx.strokeStyle = 'rgba(40,54,84,0.75)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(-amp - 22, y); ctx.lineTo(amp + 22, y);
    ctx.stroke();
    ctx.restore();

    // hanging block on the trolley
    if (!S.falling && S.mode === 'play') {
      var gold = (S.placed + 1) >= S.nextGold;
      var ci = S.tower.length % BLOCK_COLORS.length;
      ctx.save();
      ctx.strokeStyle = 'rgba(30,42,70,0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(S.carriageX, y); ctx.lineTo(S.carriageX, y + 40);
      ctx.stroke();
      ctx.restore();
      blit(blockSprite(ci, gold), S.carriageX, y + 40 + BLOCK_H / 2);

      // drop guide so the landing spot is unambiguous
      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 10]);
      ctx.beginPath();
      ctx.moveTo(S.carriageX, y + 40 + BLOCK_H);
      ctx.lineTo(S.carriageX, topY - 6);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawFallingBlock() {
    var f = S.falling;
    blit(blockSprite(f.ci, f.gold), f.x, -(f.y + BLOCK_H / 2));
  }

  function drawDebris() {
    ctx.save();
    ctx.translate(baseX(), pivotScreenY());
    ctx.rotate(leanAngle() * 0.35);
    for (var i = 0; i < S.debris.length; i++) {
      var b = S.debris[i];
      ctx.save();
      ctx.translate(b.x, -(b.y + BLOCK_H / 2));
      ctx.rotate(b.rot);
      var s = blockSprite(b.ci, b.gold);
      ctx.drawImage(s.cv, -s.w / 2, -s.h / 2, s.w, s.h);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < S.parts.length; i++) {
      var p = S.parts[i];
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  /* ---- HUD ---- */
  function drawHud(W, H) {
    if (S.mode === 'menu') return;

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    if (!hudScrim) {
      hudScrim = ctx.createLinearGradient(0, 0, 0, 180);
      hudScrim.addColorStop(0, 'rgba(8,18,44,0.55)');
      hudScrim.addColorStop(1, 'rgba(8,18,44,0)');
    }
    ctx.fillStyle = hudScrim;
    ctx.fillRect(0, 0, W, 180);

    ctx.fillStyle = '#ffffff';
    ctx.font = '900 60px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.shadowColor = 'rgba(10,20,50,0.55)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 2;
    ctx.fillText(fmt(S.score), W / 2, 26);
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

    ctx.font = '800 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    ctx.fillText('BEST  ' + fmt(Store.best()), W / 2, 92);

    if (S.combo > 1) {
      var pulse = 1 + Math.sin(S.time * 10) * 0.06;
      ctx.save();
      ctx.translate(W / 2, 130);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = '#ffe07a';
      ctx.shadowColor = 'rgba(160,90,0,0.6)'; ctx.shadowBlur = 10;
      ctx.font = '900 30px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.fillText('FLUSH x' + S.combo, 0, 0);
      ctx.restore();
    }

    drawLives();
    drawAltimeter(W, H);
    drawLeanMeter(W, H);

    if (S.toasts.length) {
      var tt = S.toasts[0];
      var a = clamp(tt.life > tt.max - 0.3 ? (tt.max - tt.life) / 0.3 : Math.min(1, tt.life / 0.5), 0, 1);
      ctx.globalAlpha = a;
      ctx.font = '800 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      var tw = Math.min(ctx.measureText(tt.text).width + 44, W - 24);
      var ty = H * 0.25;
      ctx.fillStyle = 'rgba(10,20,48,0.88)';
      roundRect(ctx, W / 2 - tw / 2, ty, tw, 44, 22); ctx.fill();
      ctx.strokeStyle = 'rgba(255,224,140,0.6)';
      ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#ffeec2';
      ctx.fillText(tt.text, W / 2, ty + 13);
      ctx.globalAlpha = 1;
    }

    // Stroke behind the fill: the sky runs from pale blue to near-black over a
    // run, so a glow alone cannot keep these readable at both ends.
    ctx.lineJoin = 'round';
    for (var i = 0; i < S.floats.length; i++) {
      var f = S.floats[i];
      ctx.globalAlpha = clamp(f.life, 0, 1);
      ctx.font = '900 ' + f.size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.strokeStyle = 'rgba(9,18,44,0.88)';
      ctx.lineWidth = Math.max(4, f.size * 0.2);
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function paintLifeOn(c, w, h) {
    c.translate(w / 2, h / 2);
    c.fillStyle = '#7dffc0';
    c.shadowColor = 'rgba(0,90,50,0.5)'; c.shadowBlur = 6;
    roundRect(c, -7, -6, 14, 12, 3); c.fill();
  }

  function drawLives() {
    var x0 = 20, y0 = 40;
    // Tiers top out at 6, but never let the row run into the score if that
    // ever changes — past 8 it collapses to one icon and a count.
    if (S.maxLives > 8) {
      blit(sprite('lifeOn', 30, 34, paintLifeOn), x0 + 7, y0);
      ctx.save();
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = '900 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('x' + S.lives, x0 + 20, y0 + 1);
      ctx.restore();
      return;
    }
    var n = S.maxLives;
    var pitch = n > 5 ? 17 : 19;
    var full = sprite('lifeOn', 30, 34, paintLifeOn);
    var empty = sprite('lifeOff', 30, 34, function (c, w, h) {
      c.translate(w / 2, h / 2);
      c.strokeStyle = 'rgba(255,255,255,0.45)';
      c.lineWidth = 1.8;
      roundRect(c, -7, -6, 14, 12, 3); c.stroke();
    });
    for (var i = 0; i < n; i++) {
      var on = i < S.lives;
      if (on && S.lives === 1) {
        ctx.save();
        ctx.globalAlpha = 0.5 + 0.5 * ((Math.sin(S.time * 8) + 1) / 2);
        blit(full, x0 + i * pitch, y0);
        ctx.restore();
      } else {
        blit(on ? full : empty, x0 + i * pitch, y0);
      }
    }
  }

  function drawAltimeter(W, H) {
    // Meaningless while the tower is short, and it competes with the blocks —
    // it appears once the camera actually starts climbing.
    if (height() < 8) return;
    var x = W - 30;
    var top = 190, bot = H - 190;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bot); ctx.stroke();

    // ticks scroll with the camera, one per 5 blocks
    var per = BLOCK_H * 5;
    var off = (S.camY % per) / per;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '800 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    for (var i = 0; i < 9; i++) {
      var ty = bot - ((i + off) * (bot - top) / 8);
      if (ty < top || ty > bot) continue;
      var level = Math.round((S.camY / BLOCK_H) / 5) * 5 + i * 5;
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(x - 7, ty); ctx.lineTo(x, ty); ctx.stroke();
      if (level % 10 === 0 && level >= 0) {
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(level, x - 11, ty);
      }
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffe07a';
    ctx.beginPath();
    var py = clamp(bot - ((height() - S.camY / BLOCK_H) * (bot - top) / 40), top, bot);
    ctx.moveTo(x + 9, py); ctx.lineTo(x + 1, py - 6); ctx.lineTo(x + 1, py + 6);
    ctx.closePath(); ctx.fill();
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.restore();
  }

  /* The lean gauge. The tower itself rotates, but only by a few degrees, so
     this is what tells you precisely how much room is left. */
  function drawLeanMeter(W, H) {
    var w = Math.min(340, W - 70);
    var x = W / 2 - w / 2, y = H - 52, h = 14;

    ctx.save();
    ctx.fillStyle = 'rgba(10,20,48,0.5)';
    roundRect(ctx, x - 5, y - 5, w + 10, h + 10, 12); ctx.fill();

    var g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#ff5a5a'); g.addColorStop(0.28, '#ffd166');
    g.addColorStop(0.5, '#6fe3b8');
    g.addColorStop(0.72, '#ffd166'); g.addColorStop(1, '#ff5a5a');
    ctx.fillStyle = g;
    ctx.globalAlpha = 0.85;
    roundRect(ctx, x, y, w, h, 7); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(x + w / 2 - 1, y - 4, 2, h + 8);

    var p = clamp(S.leanShown, -1, 1);
    var mx = x + w / 2 + p * (w / 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6;
    roundRect(ctx, mx - 5, y - 7, 10, h + 14, 5); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.font = '800 10px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('LOAD', W / 2, y - 9);

    // wind readout sits with the gauge, since wind is just extra load
    if (Math.abs(S.wind) > 3) {
      var dir = S.wind > 0 ? 1 : -1;
      var wx = W / 2 + dir * (w / 2 + 26);
      ctx.globalAlpha = clamp(Math.abs(S.wind) / 30, 0.3, 1);
      ctx.fillStyle = '#cfe6ff';
      ctx.beginPath();
      ctx.moveTo(wx + dir * 11, y + h / 2);
      ctx.lineTo(wx - dir * 7, y + h / 2 - 8);
      ctx.lineTo(wx - dir * 7, y + h / 2 + 8);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  /* =========================================================================
     11. UI WIRING
     ========================================================================= */
  var ovMenu = document.getElementById('ovMenu');
  var ovOver = document.getElementById('ovOver');
  var ovPause = document.getElementById('ovPause');
  var elFinal = document.getElementById('finalScore');
  var elBest = document.getElementById('bestScore');
  var elBestLabel = document.getElementById('bestLabel');
  var elRecord = document.getElementById('newRecord');
  var elRunStats = document.getElementById('runStats');
  var elMenuHint = document.getElementById('menuHint');
  var elOverTitle = document.getElementById('overTitle');
  var elTierPick = document.getElementById('tierPick');
  var elSuggest = document.getElementById('suggestBox');
  var elSuggestMsg = document.getElementById('suggestMsg');
  var btnSuggest = document.getElementById('btnSuggest');
  var btnSound = document.getElementById('btnSound');
  var btnPause = document.getElementById('btnPause');
  var overTitleText = 'Collapsed';

  var ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>';
  btnPause.innerHTML = ICON_PAUSE;

  function syncSoundIcon() {
    btnSound.innerHTML = (Sound.muted || !Platform.audioAllowed) ? ICON_OFF : ICON_ON;
  }

  function toggleMute() {
    Sound.muted = !Sound.muted;
    Store.data.muted = Sound.muted;
    Store.save();
    Sound.applyVolume();
    syncSoundIcon();
  }

  btnSound.addEventListener('click', function (e) {
    e.stopPropagation(); Sound.boot(); Sound.resumeCtx(); toggleMute();
  });
  btnPause.addEventListener('click', function (e) {
    e.stopPropagation();
    if (S.mode === 'play') pauseGame();
    else if (S.mode === 'paused') resumeGame();
  });

  var gameOverShown = false;

  function showOverlay(which) {
    ovMenu.hidden = which !== 'menu';
    ovOver.hidden = which !== 'over';
    ovPause.hidden = which !== 'pause';
  }

  function buildTierPicker() {
    elTierPick.innerHTML = '';
    TIERS.forEach(function (T) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tier';
      b.setAttribute('role', 'radio');
      b.id = 'tier-' + T.id;
      b.dataset.tier = T.id;
      b.innerHTML = '<span class="tn"></span><span class="tb"></span>';
      b.querySelector('.tn').textContent = T.name;
      b.querySelector('.tb').textContent = T.blurb;
      b.addEventListener('click', function () { setTier(T.id); Sound.boot(); Sound.ui(); });
      elTierPick.appendChild(b);
    });
    syncTierPicker();
  }

  function syncTierPicker() {
    var kids = elTierPick.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].setAttribute('aria-checked', kids[i].dataset.tier === Store.data.tier ? 'true' : 'false');
    }
    syncMenuHint();
  }

  function setTier(id) {
    if (Store.data.tier === id) return;
    Store.data.tier = id;
    Store.data.quickDeaths = 0;
    Store.save();
    resetRun();
    syncTierPicker();
  }

  function syncMenuHint() {
    var T = tierById(Store.data.tier);
    var best = Store.best();
    elMenuHint.innerHTML = best > 0
      ? '<b>' + T.name + '</b> · ' + T.lives + ' lives · best <b>' + fmt(best) + '</b> · tallest <b>' +
        Store.tall() + '</b><br>Tap to drop · keep the load between the markers'
      : '<b>' + T.name + '</b> · ' + T.lives + ' lives<br>' +
        '<b>Tap</b> to drop. Every block off-centre shifts the load —<br>' +
        'keep it between the markers.';
  }

  function startRun() {
    Sound.boot(); Sound.resumeCtx();
    gameOverShown = false;
    resetRun();
    S.mode = 'play';
    showOverlay(null);
    Sound.ui();
    toast('start', 'TAP TO DROP');
  }

  function showGameOver() {
    gameOverShown = true;
    var T = S.tier;
    var final = Math.floor(S.score);
    var isRecord = final > Store.best(T.id);
    if (isRecord) Store.data.bests[T.id] = final;
    if (S.peak > Store.tall(T.id)) Store.data.tallest[T.id] = S.peak;
    Store.data.runs++;

    if (S.placed < 12) Store.data.quickDeaths++;
    else Store.data.quickDeaths = 0;

    elOverTitle.textContent = overTitleText;
    elFinal.textContent = fmt(final);
    elBest.textContent = fmt(Store.best(T.id));
    elBestLabel.textContent = 'Best · ' + T.name;
    elRecord.hidden = !isRecord;
    elRunStats.textContent =
      S.peak + ' high · ' + S.flushes + ' flush · best run x' + S.bestCombo +
      ' · ' + S.misses + ' missed' + (S.shears ? ' · ' + S.shears + ' sheared' : '') +
      (S.livesGained ? ' · ' + S.livesGained + ' repaired' : '');

    applySuggestion(T);
    Store.save();
    showOverlay('over');
  }

  var suggestTarget = null;

  function applySuggestion(T) {
    var idx = tierIndex(T.id);
    suggestTarget = null;
    if (Store.data.quickDeaths >= 3 && idx > 0 && !Store.data.offeredDown) {
      suggestTarget = TIERS[idx - 1];
      elSuggestMsg.textContent =
        'Those towers came down early. ' + suggestTarget.name +
        ' swings the crane slower and gives you a wider base.';
      btnSuggest.textContent = 'Switch to ' + suggestTarget.name;
      Store.data.offeredDown = true;
    } else if (S.peak >= 32 && S.misses <= 1 && idx < TIERS.length - 1 && !Store.data.offeredUp) {
      suggestTarget = TIERS[idx + 1];
      elSuggestMsg.textContent =
        'That was a clean build. ' + suggestTarget.name + ' swings faster and scores ' +
        suggestTarget.scoreMul + '×.';
      btnSuggest.textContent = 'Try ' + suggestTarget.name;
      Store.data.offeredUp = true;
    }
    elSuggest.hidden = !suggestTarget;
  }

  btnSuggest.addEventListener('click', function () {
    if (!suggestTarget) return;
    setTier(suggestTarget.id);
    startRun();
  });

  function pauseGame() {
    if (S.mode !== 'play') return;
    S.mode = 'paused';
    Sound.wind(0, false);
    Sound.music(0, false);
    Sound.hardStop();
    showOverlay('pause');
  }

  function resumeGame() {
    if (S.mode !== 'paused') return;
    Sound.resumeCtx();
    Sound.applyVolume();
    S.mode = 'play';
    last = performance.now();
    showOverlay(null);
  }

  function toMenu() {
    S.mode = 'menu';
    resetRun();
    syncTierPicker();
    Sound.wind(0, false);
    Sound.music(0, false);
    showOverlay('menu');
  }

  document.getElementById('btnPlay').addEventListener('click', startRun);
  document.getElementById('btnAgain').addEventListener('click', startRun);
  document.getElementById('btnMenu').addEventListener('click', toMenu);
  document.getElementById('btnResume').addEventListener('click', resumeGame);
  document.getElementById('btnQuit').addEventListener('click', function () {
    overTitleText = 'Build ended';
    S.mode = 'dead'; S.deathT = 2; showGameOver();
  });

  /* =========================================================================
     12. PLATFORM PAUSE / VISIBILITY
     ========================================================================= */
  var hardPaused = false;

  function platformPause() {
    hardPaused = true;
    Sound.hardStop();
    if (S.mode === 'play') pauseGame();
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  function platformResume() {
    hardPaused = false;
    Sound.resumeCtx();
    Sound.applyVolume();
    last = performance.now();
    if (!raf) raf = requestAnimationFrame(frame);
  }

  Platform.init(platformPause, platformResume, function () {
    Sound.applyVolume();
    syncSoundIcon();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) platformPause(); else platformResume();
  });
  window.addEventListener('blur', function () { if (S.mode === 'play') pauseGame(); });

  /* =========================================================================
     13. MAIN LOOP
     ========================================================================= */
  var last = 0, raf = 0, painted = false;

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (hardPaused) return;

    var dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 0.05);
    lastDt = dt;

    if (S.mode === 'paused') return;   // no rendering while paused

    update(dt);
    render();

    if (!painted) {
      painted = true;
      Platform.firstFrame();
      Platform.ready();
    }
  }

  /* =========================================================================
     14. BOOT
     ========================================================================= */
  function boot() {
    layout();
    Sound.muted = !!Store.data.muted;
    syncSoundIcon();
    buildTierPicker();
    elBest.textContent = fmt(Store.best());
    resetRun();
    showOverlay('menu');
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });

  Store.load(boot);
})();
</script>
